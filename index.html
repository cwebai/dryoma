<title>Дрёма — ритм-игра</title>
<script>
  // объединённая версия (десктоп + мобильная): режим выбирается один раз при
  // загрузке по типу указателя — палец (coarse) считается мобильным сценарием
  // (портретный холст, игра тапом), мышь/трекпад (fine) — десктопным
  // (широкий холст, игра клавиатурой). Флаг вешаем на window и класс на
  // <html> сразу, синхронно, до отрисовки — иначе на телефоне на первый кадр
  // мелькнёт landscape-вёрстка, пока не отработает основной скрипт внизу
  window.IS_MOBILE = matchMedia('(pointer: coarse)').matches;
  document.documentElement.classList.toggle('is-mobile', window.IS_MOBILE);
</script>

    justify-content:center;
    font-family:"Courier New",Consolas,monospace;
    color:var(--cream);
    overflow:hidden;
    /* убирает системные жесты (оттягивание страницы, двойной тап-зум) над
       игровым полем — без этого палец на телефоне то скроллит страницу,
       то масштабирует её вместо игры */
    touch-action:none;
    overscroll-behavior:none;
  }
  .tv{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    width:100%;
    padding:8px;
  }
  .bezel{
    /* на телефоне безел и отступы вокруг экрана сжимаются вместе с ним —
       clamp() держит их пропорциональными, а не фиксированными в пикселях.
       Итоговая ширина ограничена одновременно по ширине (96vw) и по высоте
       экрана (через грубый пересчёт 3:2 соотношения сторон из vh), поэтому
       игра целиком помещается и в высокий портрет, и в невысокий альбом. */
    width:min(96vw, 950px, calc((92vh - 60px) * 1.55));
    padding:clamp(8px, 3vw, 26px);
    border-radius:clamp(12px, 4vw, 34px);
    background:
      radial-gradient(120% 140% at 30% 20%, #2a3050 0%, var(--bezel-1) 45%, var(--bezel-2) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.06),
      inset 0 -6px 18px rgba(0,0,0,.6),
      0 20px 50px rgba(0,0,0,.65);
  }
  .screen{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    border-radius:18px;
    overflow:hidden;
    background:#000;
    box-shadow:
      inset 0 0 60px rgba(0,0,0,.9),
      inset 0 0 0 2px rgba(241,225,249,.06);
  }
  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    /* полный набор вендорных значений — без этого часть браузеров (особенно
       Firefox и старые Chromium) молча игнорирует правило и сглаживает
       увеличенный канвас, из-за чего пиксели выглядят размытыми */
    image-rendering:optimizeSpeed;
    image-rendering:-moz-crisp-edges;
    image-rendering:-o-crisp-edges;
    image-rendering:-webkit-optimize-contrast;
    image-rendering:crisp-edges;
    image-rendering:pixelated;
    -ms-interpolation-mode:nearest-neighbor;
  }
  /* невидимое поле для регистрации имени: у канваса нет фокуса, поэтому
     без настоящего <input> мобильный браузер просто не покажет клавиатуру.
     Поле держим в потоке (не display:none — такие элементы не фокусируются),
     но нулевого размера и прозрачным, чтобы визуально всё так же рисовал канвас */
  #nameInput{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    border:none;
    opacity:0;
    background:transparent;
    color:transparent;
    caret-color:transparent;
  }
  /* CRT scanlines */
  .scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode:multiply;
  }
  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .hint{
    margin:0;
    font-size:clamp(10px, 2.6vw, 13px);
    letter-spacing:.08em;
    color:var(--lav);
    text-align:center;
    opacity:.85;
    padding:0 8px;
  }
  .hint b{color:var(--cream)}

  /* мобильный режим (см. флаг window.IS_MOBILE выше): портретный холст
     9:16 вместо десктопного landscape 3:2 — дорожки идут во всю ширину
     экрана, как в Magic Tiles, а не узкой полосой посередине */
  html.is-mobile .bezel{
    width:min(92vw, 480px, calc((92vh - 60px) * 0.5625));
  }
  html.is-mobile .screen{
    aspect-ratio:9/16;
  }
</style>
</head>
<body>
  <div class="tv">
    <div class="bezel">
      <div class="screen">
        <canvas id="game" width="450" height="300"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>
      </div>
    </div>
    <p class="hint" id="controlHint">← ↓ ↑ → — играть в такт &nbsp; · &nbsp; <b>Enter</b> — старт / рестарт</p>
  </div>
  <input id="nameInput" type="text" maxlength="10" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" enterkeyhint="done" aria-hidden="true" tabindex="-1" />

<script>
(function(){
  "use strict";

  /* ---------- базовая настройка канваса ----------
     Объединённая версия: десктопный landscape-холст 450×300 (3:2) и
     мобильный портретный 288×512 (9:16) — выбираются один раз при загрузке
     по window.IS_MOBILE (см. флаг в <head>). Оба растягиваются CSS-ом до
     реального размера экрана целым масштабом (через aspect-ratio в .screen),
     поэтому пиксели остаются жёсткими на любом устройстве. Шрифт чёткий
     только на кратных 13 кеглях (13/26/39) — это ограничение самого шрифта
     Epilepsy Sans, а не холста, и разрешение холста на резкость не влияет.
     ---------- */
  var IS_MOBILE = !!window.IS_MOBILE;
  var canvas = document.getElementById('game');
  // портретный холст 288×512 (9:16) в мобильном режиме вместо десктопного
  // landscape 450×300 (3:2) — дорожки идут во всю ширину экрана и падают на
  // большем расстоянии, как в Magic Tiles, а не узкой полосой посередине
  canvas.width = IS_MOBILE ? 288 : 450;
  canvas.height = IS_MOBILE ? 512 : 300;
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var W = canvas.width, H = canvas.height;

  // ---------- палитра (взята из сайта Persona, не из оригинала Melatonin) ----------
  var COL = {
    skyTop:   '#082c67',
    skyBot:   '#0E428E',
    cream:    '#F1E1F9',
    violet:   '#6A74D4',
    lav:      '#ACA9E6',
    ink:      '#0a0a0c',
    blood:    '#c81e3a',
    rose:     '#e6a9c8',   // тёплый акцент для "Сна о любимой"
    laneOff:  'rgba(241,225,249,0.08)',
    laneOn:   'rgba(172,169,230,0.22)'
  };

  // ---------- не даём стрелкам/пробелу/Enter скроллить страницу ----------
  var BLOCKED = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','KeyW','KeyA','KeyS','KeyD'];
  window.addEventListener('keydown', function(e){
    // экран регистрации имени печатает настоящий (пусть и невидимый) <input>
    // #nameInput — так на телефоне выезжает системная клавиатура, а на
    // десктопе он просто держит фокус незаметно. Здесь ловим только Enter
    // (подтверждение), остальные клавиши браузер сам вставляет в поле —
    // preventDefault() их бы заблокировал, а не только на экране игры
    if (state === STATE.NAME){
      if (e.key === 'Enter'){ e.preventDefault(); confirmName(); }
      return;
    }
    if (BLOCKED.indexOf(e.code) !== -1) e.preventDefault();
    handleKey(e.code);
  }, { passive:false });

  // ---------- регистрация имени: реальный инпут вместо ручного набора клавиш ----------
  // нужен ради мобильной клавиатуры (у канваса не бывает фокуса — без
  // настоящего поля браузер её просто не покажет); на десктопе работает
  // так же, как раньше, просто через штатный ввод текста
  var nameInputEl = document.getElementById('nameInput');
  nameInputEl.addEventListener('input', function(){
    var filtered = nameInputEl.value.replace(/[^A-Za-zА-Яа-яЁё0-9 ]/g, '').slice(0, NAME_MAX);
    if (filtered !== nameInputEl.value) nameInputEl.value = filtered;
    nameText = filtered;
  });
  function confirmName(){
    var typed = nameText.replace(/\s+$/, '');
    save.name = typed || 'ИГРОК';
    persist();
    state = STATE.MENU;
    nameInputEl.blur();
  }

  // ---------- звук: простой чиптюн-синтез через Web Audio, без файлов ----------
  var audioCtx = null;
  function beep(time, freq, dur, type, vol){
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(vol || 0.12, time + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + dur + 0.02);
    scheduled.push(osc);
    return osc;
  }
  // короткий дребезжащий звук на промах или нажатую ловушку — мелодия
  // буквально сбивается, раз попадание по кольцу и есть источник звука
  function glitch(time){
    beep(time, 90 + Math.random()*35, 0.09, 'sawtooth', 0.09);
  }
  // вся мелодия планируется вперёд одним куском, поэтому при обрыве сна её
  // нужно принудительно остановить, иначе музыка доиграет поверх катсцены
  var scheduled = [];
  function stopMusic(){
    scheduled.forEach(function(o){ try { o.stop(); } catch(e){} });
    scheduled = [];
  }

  // ---------- дорожки (стрелки) ----------
  // порядок дорожек слева направо: влево, вверх, вниз, вправо.
  // высота тона растёт слева направо — на этом построен спектр в фоне
  var LANES = [
    { key:'ArrowLeft',  glyph:'←', pitch:523.25 }, // до
    { key:'ArrowUp',    glyph:'↑', pitch:659.25 }, // ми
    { key:'ArrowDown',  glyph:'↓', pitch:783.99 }, // соль
    { key:'ArrowRight', glyph:'→', pitch:1046.5 }  // до (окт. выше)
  ];
  // ---------- схема управления: стрелки или WASD ----------
  // порядок кодов клавиш в каждой схеме совпадает с порядком LANES/ARROW_DIR
  // (влево, вверх, вниз, вправо), поэтому индекс в CONTROL_SCHEMES[scheme]
  // всегда указывает на ту же дорожку, что и LANES[индекс]
  var CONTROL_SCHEMES = {
    arrows: ['ArrowLeft', 'ArrowUp', 'ArrowDown', 'ArrowRight'],
    wasd:   ['KeyA', 'KeyW', 'KeyS', 'KeyD']
  };
  var WASD_LETTERS = ['A', 'W', 'S', 'D'];
  var controlScheme = 'arrows'; // перезаписывается сохранением ниже, после loadSave()
  // десктоп: узкая полоса дорожек посередине широкого холста, кольца-мишени.
  // мобильный: дорожки на всю ширину портретного холста, широкий хит-бар
  // внизу под большой палец — макет "Magic Tiles", а не landscape-полоса
  var LANE_W = IS_MOBILE ? 72 : 42; // 288/4 дорожки на мобильном, фикс. ширина на десктопе
  // размер прямоугольной плитки на мобильном — почти во всю ширину дорожки,
  // с полями по бокам, чтобы была видна граница соседней дорожки
  var TILE_W = LANE_W - 10, TILE_H = 46, TILE_BORDER = 5;
  var LANE_X = IS_MOBILE ? [36, 108, 180, 252] : [141, 197, 253, 309]; // центры дорожек
  var HIT_Y = IS_MOBILE ? 430 : 258;
  var SPAWN_Y = IS_MOBILE ? 46 : 18;
  // на мобильном дорожки идут во всю ширину экрана — герою негде стоять
  // сбоку от них, поэтому его сажаем ниже, под хит-баром и подписями клавиш,
  // у самого нижнего края, а не поверх зоны удара, как в landscape-версии
  var HERO_BASE_Y = IS_MOBILE ? H - 40 : H - 28;
  var HIT_WINDOW = 0.16;    // допуск попадания, сек
  var RESTLESS_SWITCH = 0.4; // "Тревожный сон": доля пути, на которой нота перепрыгивает (один раз, не под конец)
  var LEAD_IN = 1.6;        // пауза перед первой нотой

  /*
    Шесть снов, у каждого — своя несложная механика поверх общего движка:
      Дрёма у окна   — обычные ноты, вводный уровень без сюрпризов.
      Полёт во сне   — изредка нужно нажать две дорожки разом ("поток ветра").
      Падение        — ноты визуально падают всё быстрее к концу уровня,
                        сам бит остаётся ровным (аудио-тайминг не трогаем).
      Тревожный сон  — часть нот падает без видимого шарика: только кольцо
                        и звук, приходится играть на слух.
      Дежавю         — короткая фраза звучит дважды подряд, второй раз без
                        видимых нот (переиспользует механику "Тревожного сна").
      Кошмар         — среди обычных нот встречаются "ловушки", которые
                        нельзя нажимать: за выдержку награда, за нажатие штраф.

    normalizePatternEntry() приводит любую запись pattern к единому виду:
      0                            обычная нота на дорожке 0
      { lanes:[0,3] }              двойная нота — нужно нажать обе дорожки
      { lane:1, type:'hidden' }    скрытая нота — без видимого шарика
      { lane:2, type:'avoid' }     нота-ловушка — нажимать нельзя
  */
  function normalizePatternEntry(e){
    if (typeof e === 'number') return { lanes:[e], type:'normal' };
    if (e.type === 'rest') return { lanes:[], type:'rest' };  // пустой такт — ничего не падает, метроном тикает
    var out = { lanes: e.lanes || [e.lane], type: e.type || 'normal' };
    if (e.jumps) out.jumps = e.jumps;   // "Тревожный сон": нота 1-2 раза перескакивает на другую дорожку
    if (e.echo) out.echo = true;        // "Сон о любимой": следом летит необязательное эхо
    if (e.demo) out.demo = true;        // "Дежавю": звучит сама, независимо от нажатия — см. ниже
    return out;
  }

  /*
    Короткая фраза звучит дважды подряд, второй раз — без видимых нот, по
    памяти ("Дежавю"). Важная тонкость: мелодия во всей игре звучит только
    от попадания игрока (см. handleKey/update) — это верно для семи других
    снов, но здесь ломает саму механику. Если во время "показа" ничего не
    нажимать (а это законное поведение — смотри и запоминай), мелодия
    молчала бы совсем, и повторять по памяти было бы нечего. Поэтому
    показанная половина помечается demo:true — такие ноты получают
    настоящий мелодический тон заранее, независимо от нажатия (см.
    startGame), а скрытый повтор остаётся честно завязан на попадание.
  */
  function repeatPhrase(phrase, hideOnRepeat){
    var shown = phrase.map(function(e){
      var n = normalizePatternEntry(e);
      n.demo = true;
      return n;
    });
    var again = phrase.map(function(e){
      var n = normalizePatternEntry(e);
      return hideOnRepeat ? { lanes:n.lanes, type:'hidden' } : n;
    });
    return shown.concat(again);
  }

  var LEVELS = [
    { name: 'сон в обед', bpm: 100,
      endings: { good: 'ПОЛНА СИЛ', bad: 'ПОРА НА РАБОТУ' },
      hint: 'нажимай нужную клавишу в момент, когда нота долетит до кольца',
      cutscene: { good: 'charged', bad: 'alarm' },
      pattern: [
      0,2,1,3, 0,1,2,3, 2,0,3,1, 0,2,1,3,
      1,3,0,2, 0,1,2,3, 3,1,0,2, 0,2,1,3] },

    { name: 'полёт во сне', bpm: 108,
      endings: { good: 'ТЫ ВЗЛЕТЕЛА', bad: 'ПОТОК ОБОРВАН' },
      hint: 'иногда нужно нажать сразу две клавиши — лови поток',
      cutscene: { good: 'float', bad: 'fade' },
      pattern: [
      0,2,1,3, {lanes:[0,3]}, 1,2,
      0,1,2,3, {lanes:[1,2]}, 3,0,
      2,3,0,1, {lanes:[0,2]}, 3,1,
      0,2,1,3, {lanes:[1,3]}, 2,0,
      1,3,2,0, {lanes:[0,3]}, 1,2] },

    { name: 'падение', bpm: 120, accel: { from: 1.0, to: 0.5 },
      endings: { good: 'ПРИЗЕМЛИЛАСЬ', bad: 'СОРВАЛАСЬ' },
      hint: 'падение ускоряется к концу, ритм звука не меняется',
      cutscene: { good: 'land', bad: 'plummet' },
      pattern: [
      0,1,2,3, 3,2,1,0, 0,2,1,3, 1,3,0,2,
      2,0,3,1, 0,1,2,3, 3,1,2,0, 1,0,3,2,
      2,3,0,1, 0,3,1,2] },

    /*
      Раньше здесь ноты были полностью невидимы (type:'hidden') — без
      предварительной тренировки это оказалось честно непроходимо. Теперь
      нота видна всё время, но дрожит и ровно один раз перепрыгивает на
      другую дорожку в первой половине падения — тревожно и трудно
      уследить, но у игрока всегда есть на что смотреть. Реальная дорожка
      для нажатия (то, куда нота прилетает к моменту удара) не меняется.
    */
    { name: 'тревожный сон', bpm: 116,
      endings: { good: 'ОТПУСТИЛО', bad: 'ТРЕВОГА ПОБЕДИЛА' },
      hint: 'нота один раз перепрыгнет на другую дорожку — жди, где встанет',
      cutscene: { good: 'exhale', bad: 'anxious' },
      pattern: [
      0,{lane:2,type:'restless',jumps:[0,2]},1,3,
      0,1,{lane:3,type:'restless',jumps:[1,3]},2,
      3,0,2,{lane:1,type:'restless',jumps:[3,1]},
      1,2,0,3,
      {lane:0,type:'restless',jumps:[2,0]},2,1,3,
      0,{lane:3,type:'restless',jumps:[0,3]},2,1,
      3,1,0,{lane:2,type:'restless',jumps:[1,2]},
      2,0,3,1,
      {lane:1,type:'restless',jumps:[2,1]},3,0,2] },

    /*
      Раньше повторяемая фраза была длиной 4 и 6 нот подряд, а следом сразу
      шли новые ноты без паузы — механика читалась плохо, слишком много
      держать в памяти одновременно. Теперь фраза всего 3 ноты и повторяется
      один раз, с явным вступлением и завершением по краям.
    */
    { name: 'дежавю', bpm: 96, metronome: true,
      endings: { good: 'УЗНАЛА СОН', bad: 'СБИЛАСЬ' },
      hint: 'слушай метроном: 3 ноты — повтори их со следующего щелчка',
      cutscene: { good: 'echo', bad: 'glitch' },
      /*
        Раньше была одна длинная фраза (4 и 6 нот), а следом без паузы шли
        новые ноты — неясно было, что именно повторять и когда начинать.
        Теперь весь уровень — цепочка коротких блоков по 3 ноты: сперва
        блок показывается (видно и слышно), затем ровно те же три ноты
        нужно повторить по памяти под метроном (только звук и кольцо), и
        так три раза подряд с разными тройками нот.

        Между блоками — пауза в 2 пустых такта (rest): нота падает 2 такта
        (TRAVEL), а блоки раньше шли впритык, без зазора — новая видимая
        нота следующего блока успевала появиться на экране ДО того, как
        закрывалось окно на последнюю скрытую ноту предыдущего блока
        (проверено прогоном: обе приходились на один и тот же момент).
        Пауза сдвигает появление следующей ноты на такт позже конца
        предыдущего блока — метроном тикает и в паузе, ничего не падает.
      */
      pattern: [].concat(
      repeatPhrase([0,2,1], true),
      [{type:'rest'}, {type:'rest'}],
      repeatPhrase([3,1,2], true),
      [{type:'rest'}, {type:'rest'}],
      repeatPhrase([1,3,0], true)) },

    /*
      Обычные ноты, но некоторые тянут за собой необязательное эхо в той же
      дорожке чуть позже — как будто тянешься следом за близким человеком.
      Поймал эхо — небольшой тёплый бонус, не поймал — вообще без
      последствий, это не часть обязательного счёта.
    */
    { name: 'сон о любимой', bpm: 92,
      endings: { good: 'СЕРДЦЕ СОГРЕТО', bad: 'СОН РАСТАЯЛ' },
      endingColor: COL.rose,
      hint: 'после некоторых нот можно поймать эхо — бонус без риска',
      cutscene: { good: 'heartbeat', bad: 'heartbreak' },
      noteShape: 'heart',   // тема уровня — ноты падают сердечками, а не обычными шариками
      pattern: [
      0,1,{lane:2,echo:true},3,
      1,0,3,{lane:2,echo:true},
      2,3,{lane:1,echo:true},0,
      1,2,0,{lane:3,echo:true},
      3,1,2,0,

      0,2,{lane:1,echo:true},3,
      1,0,2,{lane:3,echo:true}] },

    { name: 'кошмар', bpm: 128,
      endings: { good: 'УСТОЯЛА', bad: 'ПОБЕЖДЕНА' },
      hint: 'красные ноты нельзя нажимать — пропускай их',
      cutscene: { good: 'defiant', bad: 'terror' },
      pattern: [
      0,1,2,3,{lane:1,type:'avoid'},
      3,2,1,0,{lane:2,type:'avoid'},
      0,2,1,3,{lane:0,type:'avoid'},
      1,3,0,2,{lane:3,type:'avoid'},
      2,0,3,1,{lane:1,type:'avoid'},{lane:2,type:'avoid'},
      0,1,2,3,{lane:0,type:'avoid'},{lane:3,type:'avoid'},
      3,1,0,2] },

    /*
      Финал: жизнь тихо угасает сама по себе (decay — здоровья в секунду),

      двойные ноты и ловушки, — в одном уровне, без нового мигания.

      слишком злыми именно здесь: это первый уровень, где decay, двойные
      ноты и ловушки сходятся вместе, и пара промахов в первые секунды (пока
      привыкаешь к новому сочетанию) обнуляла здоровье почти мгновенно, ещё
      до того как игрок успевал понять, что произошло. decay снижен, а
      штраф за промах — вдвое ниже обычного специально для этого уровня
      (остальные уровни используют missPenalty по умолчанию — 14).
    */
    { name: 'последний сон', bpm: 112, decay: 1.6, missPenalty: 7,
      endings: { good: 'ПОСЛЕДНИЙ СОН', bad: 'СОН ПОГАС' },
      hint: 'здоровье тает само собой — держи ритм без пауз',
      cutscene: { good: 'ascend', bad: 'eclipse', goodLen: 8.2 },   // победную катсцену растягиваем — обычных 3.6 сек мало для настоящего триумфа
      pattern: [
      0,1,2,3,{lanes:[0,3]},
      1,2,{lane:1,type:'avoid'},0,
      3,{lanes:[1,2]},0,2,
      1,3,0,{lane:2,type:'avoid'},
      2,0,{lanes:[0,2]},1,3,
      0,{lane:3,type:'avoid'},1,2,
      3,1,{lanes:[1,3]},0,
      2,3,0,{lane:0,type:'avoid'},
      1,2,{lanes:[0,3]},3,1] },
  ];
  var levelIdx = 0;
  var DOUBLE_BONUS = 80;   // сверх обычных очков, когда обе дорожки двойной ноты взяты вовремя

  /*
    Бесконечный сон: отдельный, девятый пункт меню, который не живёт внутри
    LEVELS — у фиксированных снов есть чёткий конец (songEnd), общий финал
    после восьмого сна (drawFinale/FINALE-состояние) и цепочка разблокировки
    по clearedCount. Бесконечный режим не проходится и не "открывает"
    следующий сон, поэтому не добавляется в сам массив LEVELS (это сломало
    бы подсчёт "8 снов" в финале и условие hasNext на экране итогов), а
    существует как девятая, отдельная плитка с собственным виртуальным
    индексом ENDLESS_IDX = LEVELS.length. curLevelDef(i) — единая точка
    доступа к "текущему уровню" вместо прямого LEVELS[levelIdx] везде по
    игре: для обычного индекса отдаёт LEVELS[i], а для ENDLESS_IDX — этот
    псевдо-уровень. Разблокируется он естественно, по той же формуле
    isUnlocked(), что и обычные сны: как девятая плитка она открывается,
    когда пройден восьмой сон ("последний сон").
  */
  var ENDLESS_IDX = LEVELS.length;
  var TOTAL_TILES = LEVELS.length + 1;
  var ENDLESS_LEVEL = {
    name: 'бесконечный сон',
    endless: true,
    bpm: 100,
    missPenalty: 14,
    endings: { bad: 'СОН ПРЕРВАН' },
    hint: 'ноты падают быстрее с каждой минутой — играй, пока хватает сил',
  };
  function curLevelDef(i){ return i === ENDLESS_IDX ? ENDLESS_LEVEL : LEVELS[i]; }

  function lerp(a,b,k){ return a + (b-a)*k; }

  // эти величины зависят от выбранного уровня и пересобираются на старте
  var BEAT, TRAVEL, chart, songEnd, totalActions, echoes;
  var ECHO_DELAY = 0.32, ECHO_WINDOW = 0.18, ECHO_BONUS = 50;

  /*
    Процедурная генерация бесконечного сна: вместо заранее написанного
    pattern (как у обычных снов) ноты досочиняются на лету, пока играем —
    см. growEndlessChart() в update(). Сложность растёт двумя способами:
    сам темп (bpm) поднимается со временем до потолка в 176, а шанс
    ловушки ("avoid", как в "Кошмаре") и двойной ноты (как в "Полёте")
    постепенно включается после первых нот — чтобы начало было мягким, а
    не сразу пугающим.
  */
  var endlessIdx = 0, endlessNextT = 0;
  var ENDLESS_LOOKAHEAD = 6; // сек нот всегда держим сгенерированными вперёд
  function endlessBpmAt(i){ return Math.min(176, ENDLESS_LEVEL.bpm + Math.floor(i / 20) * 4); }
  function endlessNoteSpec(i){
    var lane = Math.floor(Math.random() * 4);
    var avoidChance = Math.min(0.22, Math.max(0, (i - 24) / 260));
    if (Math.random() < avoidChance) return { lanes: [lane], type: 'avoid' };
    var doubleChance = Math.min(0.20, Math.max(0, (i - 12) / 220));
    if (Math.random() < doubleChance){
      var lane2 = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
      return { lanes: lane < lane2 ? [lane, lane2] : [lane2, lane], type: 'normal' };
    }
    return { lanes: [lane], type: 'normal' };
  }
  function pushEndlessNote(){
    var beat = 60 / endlessBpmAt(endlessIdx);
    var spec = endlessNoteSpec(endlessIdx);
    var n = { lanes: spec.lanes, type: spec.type, jumps: null, demo: false,
              t: endlessNextT, travel: beat * 2, judged: false, pressedCount: 0, result: null };
    endlessNextT += beat;
    endlessIdx++;
    chart.push(n);
    return n;
  }
  // просто дописывает ноты (без звука) на ENDLESS_LOOKAHEAD секунд вперёд от t
  function fillEndlessChart(t){
    while (chart.length === 0 || chart[chart.length - 1].t < t + ENDLESS_LOOKAHEAD){
      pushEndlessNote();
    }
  }
  // то же самое, но ещё и планирует звук новых нот — только для порций,
  // дописанных во время самой игры (state PLAY), когда startAudio уже задан.
  // Стартовая порция chart звучит иначе: buildChart() может быть вызван и
  // при обычной навигации по меню (стрелками влево/вправо), задолго до
  // старта игры и появления audioCtx, поэтому buildEndlessChart ниже зовёт
  // fillEndlessChart (без звука) — а её собственное озвучивание делает
  // общий chart.forEach(scheduleNoteBeeps) в startGame(), как и у обычных
  // уровней
  function growEndlessChart(t){
    while (chart.length === 0 || chart[chart.length - 1].t < t + ENDLESS_LOOKAHEAD){
      scheduleNoteBeeps(pushEndlessNote());
    }
  }
  function buildEndlessChart(){
    BEAT = 60 / ENDLESS_LEVEL.bpm;
    TRAVEL = BEAT * 2;
    chart = [];
    echoes = [];
    endlessIdx = 0;
    endlessNextT = LEAD_IN;
    songEnd = Infinity;     // бесконечный сон никогда не заканчивается сам — только по здоровью
    totalActions = 0;
    fillEndlessChart(0);
  }

  function buildChart(idx){
    if (idx === ENDLESS_IDX){ buildEndlessChart(); return; }
    var lv = LEVELS[idx];
    BEAT = 60 / lv.bpm;
    TRAVEL = BEAT * 2;      // нота падает два такта — базовое время долёта до линии
    var total = lv.pattern.length;
    echoes = [];
    chart = lv.pattern.map(function(entry, i){
      var e = normalizePatternEntry(entry);
      var travel = TRAVEL;
      if (lv.accel){
        var progress = total > 1 ? i / (total - 1) : 0;
        travel = TRAVEL * lerp(lv.accel.from, lv.accel.to, progress);
      }
      var noteT = LEAD_IN + i * BEAT;
      if (e.echo){
        // "Сон о любимой" — необязательное эхо следом за нотой в той же
        // дорожке: поймал — небольшой бонус, пропустил — без штрафа
        echoes.push({ lane: e.lanes[0], t: noteT + ECHO_DELAY, resolved:false });
      }
      return { lanes:e.lanes, type:e.type, jumps:e.jumps || null, demo: !!e.demo, t: noteT, travel: travel,
               judged: e.type === 'rest', pressedCount:0, result:null };
    });
    songEnd = chart[chart.length-1].t + chart[chart.length-1].travel + 0.6;
    totalActions = chart.reduce(function(sum, note){
      return sum + (note.type === 'avoid' ? 1 : note.lanes.length);
    }, 0);
  }
  buildChart(levelIdx);

  /*
    Бонусы за серию: на 5, 10, 15, 20 и 30 подряд начисляются отдельные очки,
    растущие по ходу серии, — чтобы длинную серию было выгодно держать, а не
    просто набивать ноты поштучно.
  */
  var COMBO_BONUS = [
    { at: 5,  pts: 100 },
    { at: 10, pts: 250 },
    { at: 15, pts: 500 },
    { at: 20, pts: 1000 },
    { at: 30, pts: 2500 },
  ];

  /*
    Понятное условие прохождения: досмотреть сон до конца мало, нужно ещё
    набрать не меньше CLEAR_PCT от очков идеального прохождения этого же
    уровня (все ноты — перфект, ловушки все обойдены, серия ни разу не
    сбивается). Эхо в "Сне о любимой" в максимум не считается — оно
    осталось бонусом сверху, не обязательным условием.
  */
  var CLEAR_PCT = 0.7;
  function levelMaxScore(){
    var sum = 0, hitPresses = 0;
    chart.forEach(function(n){
      if (n.type === 'avoid'){
        sum += 60;                                   // максимум за успешную выдержку
      } else {
        sum += 100 * n.lanes.length;                 // все нажатия — перфект
        hitPresses += n.lanes.length;
        if (n.lanes.length > 1) sum += DOUBLE_BONUS;  // обе половины двойной ноты взяты
      }
    });
    COMBO_BONUS.forEach(function(b){ if (hitPresses >= b.at) sum += b.pts; });
    return sum;
  }
  // все начисления очков в игре кратны десяти (100, 60, 80, 50, 250, 500...),
  // поэтому и цель прохождения округляем вверх до десятка — иначе получались
  // некруглые числа вроде 6293, которые в принципе нельзя набрать день ровно
  function requiredScore(){ return Math.ceil(levelMaxScore() * CLEAR_PCT / 10) * 10; }

  /*
    Сохранение в браузере: общий счёт за всё время, лучший результат за
    один заход и отдельный рекорд каждого уровня. Хранилище может быть
    недоступно (приватное окно, запрет на file://), поэтому все обращения
    обёрнуты — игра просто останется без рекордов, но не сломается.
  */
  var SAVE_KEY = 'dryoma-save-v1';
  var save = { name: '', total: 0, best: 0, levelBest: [], levelCleared: [], lastScore: [], controlScheme: 'arrows' };
  function loadSave(){
    try {
      var raw = window.localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      var got = JSON.parse(raw);
      save.name = typeof got.name === 'string' ? got.name : '';
      save.total = got.total || 0;
      save.best = got.best || 0;
      save.levelBest = Array.isArray(got.levelBest) ? got.levelBest : [];
      save.levelCleared = Array.isArray(got.levelCleared) ? got.levelCleared : [];
      save.lastScore = Array.isArray(got.lastScore) ? got.lastScore : [];
      save.controlScheme = got.controlScheme === 'wasd' ? 'wasd' : 'arrows';
    } catch (e) {}
  }
  function persist(){
    try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }
  function levelBest(i){ return save.levelBest[i] || 0; }
  // первый сон открыт всегда, дальше — только если пройден предыдущий
  function isUnlocked(i){ return i === 0 || !!save.levelCleared[i-1]; }
  // сумма лучших результатов по всем снам — итог всего прохождения целиком,
  // а не только последнего захода на последний уровень
  function allLevelsBestTotal(){
    var sum = 0;
    for (var i = 0; i < LEVELS.length; i++) sum += levelBest(i);
    return sum;
  }
  function clearedCount(){
    var n = 0;
    for (var i = 0; i < LEVELS.length; i++) if (save.levelCleared[i]) n++;
    return n;
  }
  loadSave();
  controlScheme = save.controlScheme;
  // подсказка под экраном (HTML, не канвас) — единственное место, где схема
  // управления показана текстом, а не пиксельной иконкой в кольце
  var controlHintEl = document.getElementById('controlHint');
  function updateHintText(){
    // на мобильной версии играют тапом по дорожкам — ни стрелки, ни WASD
    // там ни разу не задействованы, поэтому клавиши в подсказке не упоминаем
    if (IS_MOBILE){
      controlHintEl.innerHTML = 'тапай по дорожкам в такт';
      return;
    }
    var keys = controlScheme === 'wasd' ? 'A S W D' : '← ↓ ↑ →';
    controlHintEl.innerHTML = keys + ' — играть в такт &nbsp; · &nbsp; <b>Enter</b> — старт / рестарт';
  }
  updateHintText();
  function toggleControlScheme(){
    controlScheme = controlScheme === 'arrows' ? 'wasd' : 'arrows';
    save.controlScheme = controlScheme;
    persist();
    updateHintText();
  }

  // ---------- состояние игры ----------
  var STATE = { NAME:'name', MENU:'menu', SETTINGS:'settings', HINT:'hint', PLAY:'play', PAUSE:'pause', CUT:'cut', OVER:'over', CLEAR:'clear', FINALE:'finale' };
  var CUT_LEN = 3.6;              // длительность мини-катсцены, сек
  var cutStart = 0, cutGood = false;
  var pauseChoice = 0;    // 0/1 — выбор между "продолжить" и "в меню" на паузе
  var pausedAt = 0;       // performance.now() в момент ухода на паузу — на сколько сдвинуть startPerf при выходе
  var pausedGameT = 0;    // игровое время (now()) на момент паузы — сцена позади меню рисуется неподвижной, а не продолжает жить
  var state = save.name ? STATE.MENU : STATE.NAME;
  // фокус сразу при загрузке — на десктопе срабатывает молча, на телефоне
  // без жеста пользователя клавиатура не выедет, поэтому дублируем фокус
  // по тапу в handleTap() ниже
  if (state === STATE.NAME) nameInputEl.focus();
  var startPerf = 0, startAudio = 0;
  var score = 0, combo = 0, maxCombo = 0, hits = 0, misses = 0, avoidedCount = 0, lastUpdateT = 0;
  var health = 100;
  var flashes = []; // { lane, t, kind:'hit'|'miss' }
  var recentPresses = []; // {lane, t} — окно для защиты от "нажми все стрелки разом"
  var MASH_WINDOW = 0.05; // ноты внутри допускают ровно 2 разные дорожки (двойные), не больше
  var particles = []; // zzz-частицы спящего героя
  var bonusPops = []; // всплывающие надписи за серию
  var newLevelRecord = false, newBestRecord = false;
  var resultChoice = 0;   // 0/1 — выбор между двумя кнопками на экранах итогов
  var scoreShortfall = false; // не хватило очков до условия прохождения (не здоровья)
  var lastDelta = null;   // разница очков с прошлым заходом на этот же уровень

  // экран регистрации имени: обычный ввод с клавиатуры, не аркадный перебор
  var NAME_MAX = 10;
  var nameText = '';

  function now(){ return (performance.now() - startPerf) / 1000; }

  // тихий пульс-метроном каждой ноты — общий код для стартовой партии chart
  // (startGame) и для порций, дописываемых на лету в бесконечном сне
  // (growEndlessChart)
  function scheduleNoteBeeps(n){
    n.lanes.forEach(function(l){
      beep(startAudio + n.t, LANES[l].pitch / 2, 0.14, 'triangle', 0.05);
    });
    // "Дежавю", показанная половина фразы (demo:true): звучит настоящим
    // тоном сама по себе, не дожидаясь нажатия — иначе, если во время
    // показа честно смотреть и не нажимать, мелодия молчит и повторять
    // по памяти нечего. Скрытый повтор так не делает — там тон должен
    // прийти от попадания, это и есть проверка памяти
    if (n.demo){
      n.lanes.forEach(function(l){
        beep(startAudio + n.t, LANES[l].pitch, 0.16, 'square', 0.10);
      });
    }
  }

  function startGame(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    stopMusic();
    score = 0; combo = 0; maxCombo = 0; hits = 0; misses = 0; avoidedCount = 0; health = 100; lastUpdateT = 0;
    flashes = []; particles = []; bonusPops = [];
    // recentPresses хранит игровое время t = now(), которое обнуляется на каждом
    // новом заходе — без сброса здесь "хвост" нажатий из прошлой попытки (с
    // большим t) никогда не считался устаревшим на новом заходе (t - p.t
    // получался отрицательным и всегда проходил фильтр MASH_WINDOW), из-за
    // чего вторая половина честной двойной ноты ошибочно отбрасывалась как
    // третье нажатие подряд
    recentPresses = [];
    newLevelRecord = false; newBestRecord = false;

    startPerf = performance.now();
    startAudio = audioCtx.currentTime + 0.05;
    buildChart(levelIdx);

    /*
      Раньше вся мелодия (основной тон каждой ноты) планировалась заранее и
      звучала одинаково независимо от игры — а должна звучать от попадания,
      раз кольцо на экране и есть источник звука. Поэтому здесь заранее
      ставится только тихий пульс-метроном (то же самое, что играло раньше
      вторым, приглушённым тоном) — он держит ритм на слух с самого начала.
      Основной тон каждой ноты теперь звучит вживую из handleKey/update —
      в момент попадания, промаха или удачно обойдённой ловушки.

      Бесконечный сон озвучивает свою первую порцию нот здесь же, как и
      обычные уровни; дальнейшие порции, дописываемые уже во время игры,
      озвучивает сам growEndlessChart() внутри update() — тем же
      scheduleNoteBeeps, но по мере появления новых нот.
    */
    chart.forEach(scheduleNoteBeeps);
    // "Дежавю": отдельный ровный щелчок метронома на каждый такт (не по высоте
    // дорожки, а нейтральный) — по нему понятно, где начинается повтор
    if (curLevelDef(levelIdx).metronome){
      chart.forEach(function(n){
        beep(startAudio + n.t, 1600, 0.03, 'square', 0.05);
      });
    }

    state = STATE.PLAY;
  }

  // выход из паузы обратно в игру: сдвигаем отсчёт времени уровня на то,
  // сколько длилась пауза, иначе ноты после паузы разом посыплются вперёд
  function resumeGame(){
    startPerf += performance.now() - pausedAt;
    if (audioCtx) audioCtx.resume();
    state = STATE.PLAY;
  }

  // выход в меню прямо с паузы: текущий заход не засчитывается (как обрыв
  // сна), просто отменяется — ни очки, ни рекорд не трогаем
  function exitToMenuFromPause(){
    stopMusic();
    if (audioCtx) audioCtx.resume();
    state = STATE.MENU;
  }

  // рестарт уровня прямо с паузы: текущий заход отменяется (как и выход в
  // меню — без учёта очков) и сразу начинается заново, без захода в меню
  function restartFromPause(){
    if (audioCtx) audioCtx.resume();
    startGame();
  }

  function endGame(cleared){
    if (!cleared) stopMusic();     // сон прерван — музыка обрывается вместе с ним

    // очки засчитываются в общий счёт в любом случае: они уже заработаны
    save.total += score;
    if (score > levelBest(levelIdx)){ save.levelBest[levelIdx] = score; newLevelRecord = true; }
    if (score > save.best){ save.best = score; newBestRecord = true; }
    if (cleared) save.levelCleared[levelIdx] = true;   // открывает следующий сон

    // каждый заход — самостоятельное прохождение: сравниваем с прошлым
    // разом на этом же уровне, а не только с абсолютным рекордом
    var prevRun = save.lastScore[levelIdx];
    lastDelta = (typeof prevRun === 'number') ? (score - prevRun) : null;
    save.lastScore[levelIdx] = score;

    persist();

    resultChoice = 0;
    cutGood = cleared;
    cutStart = performance.now() / 1000;
    state = STATE.CUT;
  }

  // ---------- ввод ----------
  // экран регистрации имени сюда не попадает: он обрабатывается отдельно,
  // через настоящий #nameInput и confirmName() (см. выше) — так работает
  // и мобильная клавиатура, и обычный набор текста на десктопе
  function handleKey(code){
    // настройки открываются/закрываются клавишей S, но только из меню —
    // внутри уровня (подсказка/игра/пауза/итоги) S остаётся обычной игровой
    // клавишей (в схеме WASD это "вниз") и настройки не трогает
    // экран настроек — это переключатель "стрелки/WASD" для иконки под
    // хит-баром, а на мобильной версии эта иконка не рисуется вовсе (играют
    // тапом), поэтому сами настройки там не открываются
    if (code === 'KeyS' && !IS_MOBILE && (state === STATE.MENU || state === STATE.SETTINGS)){
      state = state === STATE.MENU ? STATE.SETTINGS : STATE.MENU;
      return;
    }
    if (state === STATE.SETTINGS){
      if (code === 'ArrowLeft' || code === 'ArrowRight') toggleControlScheme();
      return;
    }

    // пауза включается/выключается клавишей Escape только во время самой
    // игры — на экранах меню, итогов и катсцены ей делать нечего
    if (code === 'Escape'){
      if (state === STATE.PLAY){
        pausedAt = performance.now();
        pausedGameT = now();
        pauseChoice = 0;
        if (audioCtx) audioCtx.suspend();  // останавливает и звук, и ход времени внутри AudioContext
        state = STATE.PAUSE;
        return;
      }
      if (state === STATE.PAUSE){ resumeGame(); return; }
      return;
    }

    if (state === STATE.PAUSE){
      // три пункта — стоят один под другим, поэтому листаются вверх-вниз,
      // как и на экранах итогов, а не влево-вправо
      if (code === 'ArrowDown') pauseChoice = (pauseChoice + 1) % 3;
      if (code === 'ArrowUp')   pauseChoice = (pauseChoice + 2) % 3;
      if (code === 'Enter'){
        if (pauseChoice === 0) resumeGame();
        else if (pauseChoice === 1) restartFromPause();
        else exitToMenuFromPause();
      }
      return;
    }

    if (code === 'Enter'){
      if (state === STATE.CUT){ state = cutGood ? STATE.CLEAR : STATE.OVER; return; }
      if (state === STATE.HINT){ startGame(); return; }
      if (state === STATE.MENU){ if (isUnlocked(levelIdx)) state = STATE.HINT; return; }
      if (state === STATE.OVER){
        if (resultChoice === 0) state = STATE.HINT; else state = STATE.MENU;
        return;
      }
      if (state === STATE.CLEAR){
        var hasNext = levelIdx + 1 < LEVELS.length;
        if (hasNext && resultChoice === 0){ levelIdx++; buildChart(levelIdx); state = STATE.HINT; }
        else if (!hasNext) state = STATE.FINALE;  // это был последний сон — вместо возврата в меню показываем общий итог прохождения
        else state = STATE.MENU;
        return;
      }
      if (state === STATE.FINALE){ state = STATE.MENU; return; }
      return;
    }
    // на экранах итогов кнопки стоят одна под другой, поэтому переключают
    // их стрелки вверх-вниз, а не влево-вправо
    if (state === STATE.OVER || state === STATE.CLEAR){
      var optionCount = (state === STATE.CLEAR && !(levelIdx + 1 < LEVELS.length)) ? 1 : 2;
      if (optionCount === 2 && (code === 'ArrowUp' || code === 'ArrowDown')) resultChoice = resultChoice === 0 ? 1 : 0;
      return;
    }
    // в меню стрелки влево-вправо листают уровни по кругу — включая девятую
    // плитку бесконечного сна (TOTAL_TILES = LEVELS.length + 1)
    if (state === STATE.MENU){
      if (code === 'ArrowLeft')  levelIdx = (levelIdx + TOTAL_TILES - 1) % TOTAL_TILES;
      if (code === 'ArrowRight') levelIdx = (levelIdx + 1) % TOTAL_TILES;
      if (code === 'ArrowLeft' || code === 'ArrowRight') buildChart(levelIdx);
      return;
    }
    if (state !== STATE.PLAY) return;
    var laneIdx = CONTROL_SCHEMES[controlScheme].indexOf(code);
    if (laneIdx === -1) return;

    var t = now();

    // защита от "нажми все стрелки разом": честному двойной ноте (Полёт)
    // нужно ровно 2 разные дорожки почти одновременно — это разрешено, а
    // вот третья и дальнейшая дорожка в том же узком окне не засчитывается
    // вообще, никак — ни как попадание, ни как ошибка по ловушке
    recentPresses = recentPresses.filter(function(p){ return t - p.t < MASH_WINDOW; });
    var distinctLanes = {}; recentPresses.forEach(function(p){ distinctLanes[p.lane] = true; });
    var distinctCount = Object.keys(distinctLanes).length + (distinctLanes[laneIdx] ? 0 : 1);
    recentPresses.push({ lane: laneIdx, t: t });
    if (distinctCount > 2){
      flashes.push({ lane:laneIdx, t:t, kind:'whiff' });
      return;
    }

    // нота-ловушка (Кошмар) судится отдельно и раньше обычного поиска:
    // нажатие на неё — это ошибка, а не попадание, даже если дорожка совпала
    for (var ai = 0; ai < chart.length; ai++){
      var avoidNote = chart[ai];
      if (avoidNote.judged || avoidNote.type !== 'avoid') continue;
      if (avoidNote.lanes.indexOf(laneIdx) === -1) continue;
      if (Math.abs(avoidNote.t - t) > HIT_WINDOW) continue;
      avoidNote.judged = true;
      avoidNote.result = 'faulted';
      misses++;
      combo = 0;
      health -= curLevelDef(levelIdx).missPenalty || 14;
      flashes.push({ lane:laneIdx, t:t, kind:'miss' });
      glitch(audioCtx.currentTime + 0.005);
      return;
    }

    var best = null, bestDt = Infinity;
    for (var i=0;i<chart.length;i++){
      var n = chart[i];
      if (n.judged || n.type === 'avoid' || n.lanes.indexOf(laneIdx) === -1) continue;
      var dt = Math.abs(n.t - t);
      if (dt < bestDt){ bestDt = dt; best = n; }
    }
    if (best && bestDt <= HIT_WINDOW){
      best.result = bestDt <= HIT_WINDOW*0.4 ? 'perfect' : 'good';
      best.pressedCount++;
      hits++;
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      score += best.result === 'perfect' ? 100 : 60;
      health = Math.min(100, health + 2);
      flashes.push({ lane:laneIdx, t:t, kind:'hit' });
      beep(audioCtx.currentTime + 0.005, LANES[laneIdx].pitch, 0.16, 'square', 0.12); // звук — от самого попадания, не заранее

      // двойная нота (Полёт) засчитывается целиком только когда взяты обе
      // дорожки — до этого момента она остаётся неразрешённой
      if (best.pressedCount >= best.lanes.length){
        best.judged = true;
        if (best.lanes.length > 1){
          score += DOUBLE_BONUS;
          bonusPops.push({ text: 'поток   +' + DOUBLE_BONUS, t: t });
        }
      }

      // бонус за серию — ровно на отмеченных отметках
      for (var bi = 0; bi < COMBO_BONUS.length; bi++){
        if (COMBO_BONUS[bi].at === combo){
          score += COMBO_BONUS[bi].pts;
          bonusPops.push({ text: 'серия ' + combo + '   +' + COMBO_BONUS[bi].pts, t: t });
        }
      }
    } else {
      // необязательное эхо (Сон о любимой): поймал — небольшой тёплый бонус,
      // не поймал — вообще никаких последствий, это не часть обязательного счёта
      var echo = null;
      for (var ei = 0; ei < echoes.length; ei++){
        if (echoes[ei].resolved || echoes[ei].lane !== laneIdx) continue;
        if (Math.abs(echoes[ei].t - t) <= ECHO_WINDOW){ echo = echoes[ei]; break; }
      }
      if (echo){
        echo.resolved = true;
        score += ECHO_BONUS;
        bonusPops.push({ text: 'нежность   +' + ECHO_BONUS, t: t });
        flashes.push({ lane:laneIdx, t:t, kind:'hit' });
        beep(audioCtx.currentTime + 0.005, LANES[laneIdx].pitch, 0.16, 'square', 0.10);
      } else {
        flashes.push({ lane:laneIdx, t:t, kind:'whiff' });
      }
    }
  }

  function closestIndex(y, ys){
    var idx = 0, best = Infinity;
    ys.forEach(function(v, i){ var d = Math.abs(v - y); if (d < best){ best = d; idx = i; } });
    return idx;
  }

  /*
    Мобильная/мышиная версия handleKey: экран сенсорный, физических клавиш
    нет, поэтому каждое состояние получает свою зону тапа поверх того же
    текста и колец, которые уже рисуются на экране — ничего нового не
    придумываем, просто дублируем то, что можно нажать с клавиатуры, тапом
    в соответствующее место. Игровая логика не дублируется: везде, где
    можно, тап просто вызывает handleKey() с тем же кодом клавиши.
  */
  function handleTap(x, y){
    if (state === STATE.NAME){ nameInputEl.focus(); return; }

    if (state === STATE.SETTINGS){
      if (y > (IS_MOBILE ? 310 : 190)) handleKey('KeyS');                // "закрыть"
      else handleKey(x < W/2 ? 'ArrowLeft' : 'ArrowRight');              // переключить схему
      return;
    }

    if (state === STATE.PAUSE){
      pauseChoice = closestIndex(y, IS_MOBILE ? [272, 326, 380] : [160, 192, 224]);
      handleKey('Enter');
      return;
    }

    if (state === STATE.PLAY){
      // маленькая зона в углу — единственный способ поставить игру на паузу
      // без физической клавиши Escape
      if (x < 34 && y < 26){ handleKey('Escape'); return; }
      var lane = closestIndex(x, LANE_X);
      handleKey(CONTROL_SCHEMES[controlScheme][lane]);
      return;
    }

    if (state === STATE.MENU){
      var g = gridLayout();
      if (y >= g.startY && y <= g.bottom){
        var col = Math.floor((x - g.startX) / (TILE + TILE_GAP));
        var row = Math.floor((y - g.startY) / (TILE + TILE_GAP));
        if (col >= 0 && col < g.cols && row >= 0 && row < g.rows){
          var idx = row * g.cols + col;
          if (idx < TOTAL_TILES && idx !== levelIdx){ levelIdx = idx; buildChart(levelIdx); }
        }
        return;
      }
      // на мобильной версии настроек нет (см. handleKey) — весь тап ниже
      // сетки уровней просто начинает игру, отдельной зоны для "S" не нужно
      if (!IS_MOBILE && y > g.bottom + 70) handleKey('KeyS');
      else if (y > g.bottom) handleKey('Enter');  // "начать" и всё, что ниже сетки
      return;
    }

    if (state === STATE.OVER || state === STATE.CLEAR){
      resultChoice = closestIndex(y, IS_MOBILE ? [340, 394] : [200, 232]);
      handleKey('Enter');
      return;
    }

    // подсказка перед уровнем, катсцена, общий итог — везде один тап это Enter
    handleKey('Enter');
  }

  // Pointer Events разом покрывают и тач, и мышь — на десктопе тап по тем
  // же зонам работает кликом, это просто побочный бонус, а не отдельная
  // "мышиная" функция
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (canvas.width / rect.width);
    var y = (e.clientY - rect.top) * (canvas.height / rect.height);
    handleTap(x, y);
  });

  // длительность катсцены обычно одна и та же для всех (CUT_LEN), но финалу
  // после хорошей концовки этого мало для настоящего триумфа — уровень
  // единственный, где decay заставляет реально тренироваться, и победа
  // заслуживает более долгой, многофазной сцены, а не такой же короткой
  // вспышки, как везде. Переопределяется полем goodLen/badLen у cutscene
  function cutsceneLen(){
    var lv = curLevelDef(levelIdx);
    var cs = (lv && lv.cutscene) || {};
    var override = cutGood ? cs.goodLen : cs.badLen;
    return override || CUT_LEN;
  }

  // ---------- обновление ----------
  function update(){
    if (state === STATE.CUT){
      if (performance.now()/1000 - cutStart > cutsceneLen()) state = cutGood ? STATE.CLEAR : STATE.OVER;
      return;
    }
    if (state !== STATE.PLAY) return;
    var t = now();

    // затухание (Последний сон): жизнь тихо угасает сама по себе, попадания
    // лишь компенсируют её — на обычных уровнях decay не задан, ничего не меняется
    var curLevel = curLevelDef(levelIdx);
    if (curLevel.decay) health -= curLevel.decay * (t - lastUpdateT);
    lastUpdateT = t;

    // бесконечный сон дописывает ноты по мере игры — держим буфер на
    // ENDLESS_LOOKAHEAD секунд вперёд, каждый кадр понемногу
    if (curLevel.endless) growEndlessChart(t);

    for (var i=0;i<chart.length;i++){
      var n = chart[i];
      if (n.judged || t <= n.t + HIT_WINDOW) continue;
      n.judged = true;
      if (n.type === 'avoid'){
        // дожила до конца окна без нажатия — то, чего и требовала эта нота:
        // награда, а не промах
        n.result = 'avoided';
        avoidedCount++;
        health = Math.min(100, health + 2);
        score += 60;
        n.lanes.forEach(function(l){
          flashes.push({ lane:l, t:t, kind:'hit' });
          beep(audioCtx.currentTime + 0.005, LANES[l].pitch, 0.16, 'square', 0.10);
        });
      } else {
        n.result = 'miss';
        misses++;
        combo = 0;
        health -= curLevel.missPenalty || 14;
        n.lanes.forEach(function(l){ flashes.push({ lane:l, t:t, kind:'miss' }); });
        glitch(audioCtx.currentTime + 0.005);   // нота осталась без ответа — мелодия сбивается
      }
    }
    echoes.forEach(function(ec){ if (!ec.resolved && t > ec.t + ECHO_WINDOW) ec.resolved = true; }); // просто гаснет, без последствий
    flashes = flashes.filter(function(f){ return t - f.t < 0.25; });
    bonusPops = bonusPops.filter(function(b){ return t - b.t < 1.4; });

    // бесконечный сон копит ноты без ограничения по времени — старые,
    // уже отсуженные ноты вычищаются из начала chart, иначе за долгий заход
    // массив рос бы неограниченно
    if (curLevel.endless && chart.length > 40){
      while (chart.length > 40 && chart[0].judged && t - chart[0].t > 3) chart.shift();
    }

    if (health <= 0){ scoreShortfall = false; endGame(false); return; }
    if (t > songEnd){
      var need = requiredScore();
      scoreShortfall = score < need;
      endGame(score >= need);
      return;
    }

    // частицы zzz у спящего героя, почаще при хорошем комбо — 23px над
    // головой героя, HERO_BASE_Y задаёт саму голову (см. drawSleeper)
    if (Math.random() < (combo > 4 ? 0.10 : 0.03)){
      particles.push({ x: W/2 + 27, y: HERO_BASE_Y - 23, life:1, vy:-12 - Math.random()*9 });
    }
    particles.forEach(function(p){ p.y += p.vy*0.016; p.life -= 0.016; });
    particles = particles.filter(function(p){ return p.life > 0; });
  }

  /*
    Сила последней прозвучавшей доли, 1 сразу после ноты и 0 к следующей.
    Ноты расписаны в chart заранее, поэтому картинка попадает в звук точно,
    без анализа аудио. Вне игры возвращает 0: в меню музыка не играет,
    значит и реагировать не на что.
  */
  function beatEnergy(t){
    if (state !== STATE.PLAY) return 0;
    var last = -1;
    for (var i = 0; i < chart.length; i++){
      if (chart[i].t <= t) last = chart[i].t; else break;
    }
    if (last < 0) return 0;
    return Math.max(0, 1 - (t - last) / (BEAT * 0.9));
  }

  // ---------- рисование ----------
  function px(x,y,w,h,color){ ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  /*
    Canvas всегда сглаживает fillText/arc/gradient сабпикселями — отсюда
    ощущение "размытости" даже при честном целочисленном 3× масштабе.
    Чтобы пиксели были жёсткими и бинарными:
      - весь текст рендерим один раз в офскрин-канвас обычным шрифтом,
        затем БИНАРИЗУЕМ альфа-канал (пиксель либо полностью цвет, либо
        полностью прозрачный) — получается настоящий чёткий пиксельный текст
        на любых символах (включая кириллицу), без ручного рисования шрифта;
      - круги и кольца считаем по расстоянию до центра вручную (px-по-пикселю),
        не через ctx.arc — так круг получается жёстким, без полутонов на краю;
      - фон неба — плоские полосы цвета вместо плавного градиента.
  */
  /*
    Epilepsy Sans — пиксельный шрифт: em у него 1300 единиц, а шаг внутренней
    сетки — 100 единиц. Значит одна клетка рисунка равна ровно одному пикселю
    только при кегле 13. На любом другом кегле (8, 9, 10, 14) клетка попадает
    между пикселями, буква расплывается по полупрозрачным краям, и никакая
    бинаризация её уже не соберёт — именно поэтому текст был нечитаемым.

    Поэтому рисуем ТОЛЬКО на кегле 13 и его целых кратных (26 — заголовки),
    в целочисленных координатах, без суперсэмплинга и без масштабирования.
    Метрики шрифта: ascender 1100 = 11 клеток, descender 200 = 2 клетки,
    строка ровно 13 клеток высотой. Бинаризация оставлена страховкой: на
    родном кегле края и так ложатся точно в пиксели, так что она не мешает.
  */
  var FONT_FAMILY = '"Epilepsy Sans","Verdana","Tahoma",sans-serif';
  var FONT_NATIVE = 13;   // родной кегль шрифта — менять нельзя
  // на кегле 13 строчная буква всего 6 пикселей холста, для кириллицы этого
  // мало: "м", "и", "н", "ш" различаются деталями в один пиксель. Поэтому
  // весь текст идёт на удвоенном и утроенном кегле — это следующие кратные
  // 13, на которых пиксельная сетка шрифта по-прежнему точная
  var TEXT = FONT_NATIVE * 2;    // 26 — основной текст, строчная 12 px
  var TITLE = FONT_NATIVE * 3;   // 39 — заголовки, строчная 18 px
  var ASC_CELLS = 11;     // hhea.ascender  = 1100 / 100
  var DESC_CELLS = 2;     // hhea.descender =  200 / 100
  var textCache = Object.create(null);
  // шрифт встроен как data:URI и обычно готов почти мгновенно, но браузер
  // всё равно грузит его асинхронно — на случай пары первых кадров с
  // запасным шрифтом сбрасываем кэш текста, как только основной подключится
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ textCache = Object.create(null); });
  }
  function pixelTextCanvas(str, fontPx, color){
    var key = str + '|' + fontPx + '|' + color;
    var cached = textCache[key];
    if (cached) return cached;

    // кегль принудительно приводится к кратному 13, иначе шрифт "поплывёт"
    var scale = Math.max(1, Math.round(fontPx / FONT_NATIVE));
    var size = FONT_NATIVE * scale;
    // вес строго 400 — совпадает с @font-face, поэтому браузер не станет
    // подделывать жирное начертание и смазывать пиксельную сетку
    var font = '400 ' + size + 'px ' + FONT_FAMILY;

    var probe = document.createElement('canvas').getContext('2d');
    probe.font = font;
    var w = Math.max(1, Math.ceil(probe.measureText(str).width));
    var h = (ASC_CELLS + DESC_CELLS) * scale;

    var off = document.createElement('canvas');
    off.width = w; off.height = h;
    var octx = off.getContext('2d');
    octx.font = font;
    octx.textBaseline = 'alphabetic';
    octx.fillStyle = '#ffffff';
    octx.fillText(str, 0, ASC_CELLS * scale);

    var img = octx.getImageData(0, 0, w, h);
    var d = img.data;
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(color);
    var r = m ? parseInt(m[1],16) : 255, g2 = m ? parseInt(m[2],16) : 255, b = m ? parseInt(m[3],16) : 255;
    for (var i = 0; i < d.length; i += 4){
      if (d[i+3] > 127){ d[i]=r; d[i+1]=g2; d[i+2]=b; d[i+3]=255; }
      else { d[i+3] = 0; }
    }
    octx.putImageData(img, 0, 0);
    textCache[key] = off;
    return off;
  }
  function drawPixelText(str, x, y, fontPx, color){
    var img = pixelTextCanvas(str, fontPx, color);
    ctx.drawImage(img, Math.round(x), Math.round(y));
    return img.width;
  }
  function drawPixelTextCentered(str, cx, y, fontPx, color){
    var img = pixelTextCanvas(str, fontPx, color);
    ctx.drawImage(img, Math.round(cx - img.width/2), Math.round(y));
  }

  /*
    Перенос длинных строк по словам. Нужен из-за объединения десктопной и
    мобильной версий в один файл: часть текста (подсказки уровней, итоговая
    статистика) писалась и мерилась на глаз под landscape-холст 450px
    шириной, а на портретном мобильном холсте (288px) та же строка на том же
    кегле в него уже не помещается и вылезает за край экрана. centerText()
    ниже принимает необязательный maxWidth и прогоняет через эту функцию —
    на десктопе, где текст и так помещается, перенос ни на что не влияет.
  */
  var wrapProbe = document.createElement('canvas').getContext('2d');
  function measurePixelWidth(str, fontPx){
    var scale = Math.max(1, Math.round(fontPx / FONT_NATIVE));
    wrapProbe.font = '400 ' + (FONT_NATIVE * scale) + 'px ' + FONT_FAMILY;
    return wrapProbe.measureText(str).width;
  }
  function wrapPixelText(str, fontPx, maxWidth){
    var words = String(str).split(' ');
    var lines = [], cur = '';
    for (var i = 0; i < words.length; i++){
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (cur && measurePixelWidth(test, fontPx) > maxWidth){
        lines.push(cur);
        cur = words[i];
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // жёсткое кольцо/круг по расстоянию до центра, без сглаживания
  function drawRing(cx, cy, rOuter, rInner, color){
    var r2o = rOuter*rOuter, r2i = rInner*rInner;
    for (var yy = -rOuter; yy <= rOuter; yy++){
      for (var xx = -rOuter; xx <= rOuter; xx++){
        var d2 = xx*xx + yy*yy;
        if (d2 <= r2o && d2 >= r2i) px(cx+xx, cy+yy, 1, 1, color);
      }
    }
  }
  function drawDisc(cx, cy, r, color){
    var r2 = r*r;
    for (var yy = -r; yy <= r; yy++){
      for (var xx = -r; xx <= r; xx++){
        if (xx*xx + yy*yy <= r2) px(cx+xx, cy+yy, 1, 1, color);
      }
    }
  }
  // пиксельное сердечко — два лепестка-диска сверху и сужающийся книзу
  // треугольный "хвост"; r задаёт масштаб примерно как в drawDisc
  function drawHeart(cx, cy, r, color){
    drawDisc(cx - r*0.5, cy - r*0.32, r*0.62, color);
    drawDisc(cx + r*0.5, cy - r*0.32, r*0.62, color);
    var rows = Math.max(1, Math.round(r*1.3));
    for (var i = 0; i <= rows; i++){
      var w = r*2.05 * (1 - i/rows);
      px(cx - w/2, cy - r*0.05 + i, w, 1, color);
    }
  }
  // одна половина сердца (левая при side<0, правая при side>0) — свой лепесток
  // и половина треугольного хвоста ровно до центра; две половины, нарисованные
  // без смещения в одной точке, дают то же целое сердце, что и drawHeart
  function drawHeartHalf(cx, cy, r, color, side){
    drawDisc(cx + side*r*0.5, cy - r*0.32, r*0.62, color);
    var rows = Math.max(1, Math.round(r*1.3));
    for (var i = 0; i <= rows; i++){
      var half = r*2.05 * (1 - i/rows) / 2;
      if (side < 0) px(cx - half, cy - r*0.05 + i, half, 1, color);
      else px(cx, cy - r*0.05 + i, half, 1, color);
    }
  }
  // компактные пиксельные стрелки для колец мишеней — без fillText
  function drawArrowIcon(dir, cx, cy, color){
    var pts;
    if (dir === 'left')  pts = [[3,-4],[2,-4],[1,-3],[0,-2],[-1,-1],[-2,0],[-1,1],[0,2],[1,3],[2,4],[3,4]];
    if (dir === 'right') pts = [[-3,-4],[-2,-4],[-1,-3],[0,-2],[1,-1],[2,0],[1,1],[0,2],[-1,3],[-2,4],[-3,4]];
    if (dir === 'up')    pts = [[-4,3],[-4,2],[-3,1],[-2,0],[-1,-1],[0,-2],[1,-1],[2,0],[3,1],[4,2],[4,3]];
    if (dir === 'down')  pts = [[-4,-3],[-4,-2],[-3,-1],[-2,0],[-1,1],[0,2],[1,1],[2,0],[3,-1],[4,-2],[4,-3]];
    pts.forEach(function(p){ px(cx+p[0], cy+p[1], 1, 1, color); });
  }
  // буква WASD в кольце мишени — тот же пиксельный шрифт, что и весь текст
  // игры, отцентрованная и по горизонтали, и по вертикали относительно cx/cy
  function drawLetterIcon(letter, cx, cy, color){
    var img = pixelTextCanvas(letter, FONT_NATIVE, color);
    ctx.drawImage(img, Math.round(cx - img.width/2), Math.round(cy - img.height/2));
  }

  /*
    Шестерёнка — просто картинка на экране настроек (клавиша S в меню),
    без мыши и без хит-теста. Рисуется тем же способом, что кольца мишеней —
    по расстоянию до центра, без ctx.arc, чтобы остаться в едином пиксельном
    стиле игры. Зубцы — те же пиксели, что и обод, но только в узких
    секторах через равные промежутки угла.
  */
  function drawGear(cx, cy, r, color){
    var rInner = r - 3, toothLen = 3, toothCount = 8, toothDeg = 22;
    var sector = 360 / toothCount;
    var outer = r + toothLen;
    for (var yy = -outer; yy <= outer; yy++){
      for (var xx = -outer; xx <= outer; xx++){
        var d = Math.sqrt(xx*xx + yy*yy);
        if (d >= rInner && d <= r){
          px(cx+xx, cy+yy, 1, 1, color);
        } else if (d > r && d <= outer){
          var deg = (Math.atan2(yy, xx) * 180 / Math.PI + 360) % 360;
          if ((deg % sector) < toothDeg) px(cx+xx, cy+yy, 1, 1, color);
        }
      }
    }
    drawDisc(cx, cy, 2, color);
  }

  // две вертикальные полоски в углу экрана — единственная подсказка, куда
  // тапнуть, чтобы поставить игру на паузу без клавиши Escape (см. handleTap)
  function drawPauseButton(){
    px(9, 6, 5, 16, COL.lav);
    px(20, 6, 5, 16, COL.lav);
  }

  /*
    Фон переделан: море не подходило по смыслу игре про сон. Вместо него —
    просто ночное небо целиком: луна, звёзды и медленно всплывающие вверх
    сонные огоньки (как пузырьки во сне или отсветы мыслей), без деления на
    небо/воду и без единой конкретной "локации" — это чище укладывается в
    "сонное, вдохновлённое сном", а не в пляжную сцену.
  */
  function drawBackground(t){
    // плоские полосы вместо градиента — жёстче и ближе к "ограниченной палитре"
    var bands = ['#082c67','#0a3574','#0c3d81','#0E428E'];
    var bandH = Math.ceil(H / bands.length);
    bands.forEach(function(c, i){ px(0, i*bandH, W, bandH+1, c); });

    // луна — честный пиксельный круг + пара кратеров, без развалившихся вырезов.
    // на мобильном холст уже (288 вместо 450), поэтому луна перенесена в
    // верхний правый угол портретного холста — на десктопе она почти у
    // правого края landscape-холста той же высоты, что и HUD
    var moonX = IS_MOBILE ? 246 : 387, moonY = IS_MOBILE ? 56 : 48;
    drawDisc(moonX, moonY, 16, COL.cream);
    drawDisc(moonX-6, moonY-6, 2, COL.skyTop);
    drawDisc(moonX+6, moonY+4, 2, COL.skyTop);
    drawDisc(moonX+3, moonY-9, 2, COL.skyTop);

    // мягкое сияние вокруг луны — несколько полупрозрачных колец, не резкая
    // граница: свет во сне обычно расплывчатый, а не чёткий, как прожектор
    ctx.globalAlpha = 0.08;
    drawDisc(moonX, moonY, 24, COL.cream);
    ctx.globalAlpha = 0.05;
    drawDisc(moonX, moonY, 32, COL.cream);
    ctx.globalAlpha = 1;

    // мерцающие звёзды по всему небу — горизонта больше нет, значит и делить
    // высоту на "небо/воду" незачем
    for (var i=0;i<40;i++){
      var sx = (i*37 + 13) % W;
      var sy = (i*53 + 7) % H;
      var flick = (Math.sin(t*3 + i) + 1) / 2;
      if (flick > 0.35) px(sx, sy, 1, 1, i % 3 === 0 ? COL.lav : COL.cream);
    }

    // сонные огоньки: медленно всплывают вверх и зацикливаются, каждый со
    // своей скоростью и фазой — никакой конкретной формы вроде облака или
    // подушки, просто тёплые точки света, плывущие сквозь сон
    for (var k = 0; k < 14; k++){
      var fx = (k * 71 + 23) % W;
      var speed = 6 + (k % 5) * 3;
      var fy = H - ((t * speed + k * 47) % (H + 20));
      var flicker = 0.25 + 0.35 * Math.abs(Math.sin(t * 2 + k));
      ctx.globalAlpha = flicker;
      px(fx, fy, 2, 2, k % 2 ? COL.lav : COL.cream);
      ctx.globalAlpha = 1;
    }
  }

  /*
    Эквалайзер как настоящий спектр, а не общее мигание на каждый клик.
    Полоса экрана слева направо — это шкала высоты тона: слева самая низкая
    дорожка (стрелка влево, до), справа самая высокая (стрелка вправо, до
    октавой выше). Прозвучавшая нота поднимает только тот участок спектра,
    который ей соответствует, и затухает к следующей доле. Цвет всплеска
    говорит, как ты сыграла: кремовый — нота взята (или ловушка удачно
    обойдена), красный — промах (или нажатая ловушка). Двойная нота светит
    сразу два места спектра. Поэтому по фону видно и рисунок мелодии, и
    качество игры, а не просто одинаковую дрожь. Раньше столбики росли от
    линии горизонта (моря), теперь — прямо от нижнего края экрана, как
    сияние, поднимающееся из сна.
  */
  var EQ_BAR_W = 15, EQ_SPREAD = 5.5, EQ_MAX_H = 46;
  function drawEqualizer(t){
    var bars = Math.ceil(W / EQ_BAR_W);
    var heights = [], colors = [];
    for (var b = 0; b < bars; b++){ heights.push(3); colors.push(null); }

    for (var i = 0; i < chart.length; i++){
      var n = chart[i];
      var age = t - n.t;
      if (age < 0 || age > BEAT * 1.4) continue;
      var decay = 1 - age / (BEAT * 1.4);
      var color = (n.result === 'miss' || n.result === 'faulted') ? COL.blood : (n.result ? COL.cream : COL.violet);
      n.lanes.forEach(function(lane){                       // двойная нота светит оба места спектра разом
        var center = (lane + 0.5) / LANES.length * bars;
        for (var b2 = 0; b2 < bars; b2++){
          var falloff = 1 - Math.abs(b2 - center) / EQ_SPREAD;
          if (falloff <= 0) continue;
          var h = 3 + decay * falloff * falloff * EQ_MAX_H;
          if (h > heights[b2]){
            heights[b2] = h;
            colors[b2] = color;
          }
        }
      });
    }
    for (var b3 = 0; b3 < bars; b3++){
      ctx.globalAlpha = colors[b3] ? 0.5 : 0.22;
      px(b3 * EQ_BAR_W, H - heights[b3], EQ_BAR_W - 3, heights[b3], colors[b3] || COL.violet);
      ctx.globalAlpha = 1;
    }
  }

  /*
    Герой рисуется одной функцией в единицах маленького спящего: тело 36×21,
    уши по бокам, глаза и рот на своих местах. Масштаб s умножает все размеры,
    поэтому в катсцене это ровно тот же персонаж, только крупнее. mood задаёт
    выражение: сон, испуг, радость, злость.
  */
  function drawHero(cx, cy, s, mood){
    var u = function(v){ return Math.round(v * s); };
    var bw = u(36), bh = u(21);
    var x = Math.round(cx - bw/2), y = Math.round(cy - bh/2);

    px(x, y, bw, bh, COL.cream);                    // тело
    px(x - u(3), y + u(6), u(6), u(12), COL.cream); // ухо слева
    px(x + bw,   y + u(6), u(6), u(12), COL.cream); // ухо справа

    var eL = x + u(6), eR = x + u(25), eY = y + u(5);
    var mx = x + u(14), my = y + u(12);

    /*
      Мимика нарочно бедная. На фигурке такого размера подробное лицо —
      брови, дуги глаз, широкий рот с уголками — сливается в грязное пятно,
      поэтому у каждого состояния оставлено две-три детали, а остальное
      досказывает движение: покачивание, вздрагивание, прыжки, тряска.
      Радость и злость отличаются только тем, куда смотрят уголки рта.
    */
    if (mood === 'sleep'){
      px(eL, eY + u(1), u(5), u(2), COL.ink);       // прикрытые глаза
      px(eR, eY + u(1), u(5), u(2), COL.ink);
      px(mx + u(2), my, u(5), u(2), COL.violet);
    } else if (mood === 'wake'){
      px(eL, eY - u(1), u(5), u(5), COL.ink);       // только распахнутые глаза
      px(eR, eY - u(1), u(5), u(5), COL.ink);
    } else if (mood === 'happy'){
      px(eL, eY, u(5), u(3), COL.ink);
      px(eR, eY, u(5), u(3), COL.ink);
      px(mx + u(2), my + u(1), u(5), u(2), COL.ink);   // уголки подняты
      px(mx,        my,        u(2), u(2), COL.ink);
      px(mx + u(7), my,        u(2), u(2), COL.ink);
    } else if (mood === 'angry'){
      px(eL, eY, u(5), u(3), COL.ink);
      px(eR, eY, u(5), u(3), COL.ink);
      px(mx + u(2), my,        u(5), u(2), COL.ink);   // те же уголки, вниз
      px(mx,        my + u(1), u(2), u(2), COL.ink);
      px(mx + u(7), my + u(1), u(2), u(2), COL.ink);
    } else if (mood === 'scared'){
      // страх: глаза распахнуты сильнее и шире, чем при "wake" (там просто
      // проснулась — тут именно испуг), плюс маленький дрожащий рот "о"
      px(eL - u(1), eY - u(1), u(7), u(6), COL.ink);
      px(eR - u(1), eY - u(1), u(7), u(6), COL.ink);
      px(mx + u(2), my, u(3), u(3), COL.violet);
    } else if (mood === 'anxious'){
      // тревога — не гнев и не ужас: нет ни опущенных уголков рта (злость),
      // ни распахнутых глаз (испуг). Сведённые к переносице брови и узкие,
      // напряжённые глаза, рот сжат в тонкую линию — лицо человека, который
      // весь вечер ждёт, что что-то пойдёт не так
      px(eL, eY - u(2), u(5), u(2), COL.ink);          // нахмуренные брови
      px(eR, eY - u(2), u(5), u(2), COL.ink);
      px(eL + u(1), eY + u(1), u(3), u(2), COL.ink);   // сощуренные глаза — уже обычных
      px(eR + u(1), eY + u(1), u(3), u(2), COL.ink);
      px(mx + u(1), my + u(1), u(6), u(1), COL.ink);   // поджатый рот — тонкая прямая линия
    } else if (mood === 'sad'){
      // разбитое сердце: не злость и не страх — просто опущенный взгляд,
      // одна медленная слеза и мягко опущенные, без острых уголков, губы
      px(eL, eY, u(5), u(3), COL.ink);
      px(eR, eY, u(5), u(3), COL.ink);
      px(eL + u(1), eY + u(4), u(2), u(3), COL.lav);   // слеза под левым глазом
      px(mx + u(1), my + u(2), u(6), u(1), COL.ink);   // опущенная линия рта, без уголков
    } else if (mood === 'confused'){
      // "Дежавю" сбилась: лицо буквально рассинхронизировано, а не просто
      // грустное или испуганное — один глаз выше и шире другого, рот
      // разъехался на две несовпадающие половины, будто кадры записи
      // соскочили друг относительно друга
      px(eL, eY - u(1), u(5), u(4), COL.ink);
      px(eR, eY + u(2), u(3), u(2), COL.ink);
      px(mx,        my,        u(3), u(2), COL.ink);
      px(mx + u(5), my + u(2), u(3), u(2), COL.ink);
    }
  }

  /*
    Мини-катсцена на чёрном фоне между игрой и экраном итогов: герой
    просыпается. Досмотрела сон — радуется и подпрыгивает, прервала —
    вздрагивает спросонья и злится. Enter пропускает.
  */
  function drawCutscene(nowSec){
    var e = nowSec - cutStart;
    px(0, 0, W, H, COL.ink);

    /*
      Подача как в тех катсценах, где крошечная фигурка стоит одна посреди
      огромного тёмного поля: герой рисуется в своём обычном, самом мелком
      масштабе (s=1, тело 36×21 точки на холсте 450×300) и стоит ровно в
      центре. Ни одной надписи здесь нет намеренно — ни подписи исхода, ни
      подсказки про клавишу, ни сонных букв. Настроение держится только на
      движении: сонное покачивание, резкое пробуждение, прыжки от радости
      или тряска от злости. Подпись исхода ждёт на экране итогов следом.
    */
    /*
      Движение подбирается под тему конкретного сна, а не одно на все восемь:
      "bounce"/"shake" — прежнее поведение по умолчанию (прыжок радости /
      дрожь досады), "float" — герой тихо всплывает вверх, покачиваясь
      (для тёплых/спокойных хороших концовок), "fade" — герой оседает и
      слегка тает (для концовок вроде "растаял"/"угас"). Ни новых надписей,
      ни новых состояний — просто другая траектория той же фигурки.
    */
    var lv = curLevelDef(levelIdx);
    var cs = lv.cutscene || {};
    var goodMotion = cs.good || 'bounce';
    var badMotion = cs.bad || 'shake';

    var cx = W/2, cy = H/2, s = 0.7;   // ещё мельче: тело 25×15 точек
    var mood, dx = 0, dy = 0, scale = s;
    var sleepUntil = cutGood ? 1.0 : 0.8;

    if (e < sleepUntil){ mood = 'sleep'; dy = Math.sin(e*3) * 1; }
    else if (cutGood){
      if (e < 1.4){ mood = 'wake'; dy = -2; }
      else {
        mood = 'happy';
        var k1 = e - 1.4;
        if (goodMotion === 'float'){ dy = -Math.min(15, k1*5); dx = Math.sin(k1*2)*3; }
        else if (goodMotion === 'charged'){                 // заряжена энергией: частые резкие подскоки + лёгкая пульсация размера
          dy = -Math.abs(Math.sin(k1*10)) * 5;
          scale = s * (1 + Math.abs(Math.sin(k1*10)) * 0.08);
        }
        else if (goodMotion === 'exhale'){                  // выдох: один плавный вдох-выдох, без прыжков
          var breath = Math.min(1, k1/1.2);
          scale = s * (1 + Math.sin(breath*Math.PI) * 0.12);
          dy = -Math.sin(breath*Math.PI) * 3;
        }
        else if (goodMotion === 'land'){                    // мягкая посадка: одно приседание, один отскок, и покой
          if (k1 < 0.3) dy = k1/0.3 * 3;
          else if (k1 < 0.6) dy = 3 - (k1-0.3)/0.3*5;
          else dy = Math.sin((k1-0.6)*3) * 1;
        }
        else if (goodMotion === 'ascend'){
          /*
            Финал заслуживает не такую же короткую вспышку, как остальные
            семь снов, а настоящий триумф в несколько фаз (сцена растянута
            через goodLen до 8.2 сек вместо обычных 3.6):
              1) взлёт    — быстрый радостный рывок вверх, как и раньше
              2) подъём   — долгий величественный полёт со спиралью и ростом
              3) кульминация — герой замирает на пике, на миг раздувается
                 и застывает — здесь же screenFlash даёт вспышку света
              4) послесвечение — мягко оседает и просто светится, спокойно
          */
          if (k1 < 1.2){                                     // 1) взлёт
            dy = -Math.abs(Math.sin(k1*3.6)) * 10;
            dx = Math.sin(k1*3) * 4;
            scale = s * (1 + Math.min(0.1, k1*0.08));
          } else if (k1 < 3.6){                               // 2) подъём
            var k1b = k1 - 1.2;
            dy = -Math.min(46, 10 + k1b*13);
            dx = Math.sin(k1b*2) * 6;
            scale = s * (1.1 + Math.min(0.25, k1b*0.08));
          } else if (k1 < 4.6){                               // 3) кульминация
            var k1c = k1 - 3.6;
            var swell = Math.sin(Math.min(1, k1c/1.0) * Math.PI);
            dy = -46 - swell*4;
            dx = Math.sin(k1c*4) * 2;
            scale = s * (1.35 + swell*0.3);
          } else {                                            // 4) послесвечение
            var k1d = Math.min(1, (k1 - 4.6) / 2.2);
            dy = -46 + k1d*10;
            dx = Math.sin(k1*1.2) * 3;
            scale = s * (1.35 - k1d*0.2);
          }
        }
        else if (goodMotion === 'defiant'){                 // не радость, а стойкость после страха: без прыжков — просто выпрямляется и на миг вырастает
          scale = s * (1 + Math.min(0.16, k1*0.12));
          dy = -Math.min(4, k1*3);
        }
        else if (goodMotion === 'heartbeat'){               // "Сон о любимой": не полёт, а невесомое покачивание в такт биению — самого героя почти не уносит, весь акцент на сердце над головой (см. частицы)
          dy = -Math.min(8, k1 * 2.4);
          dx = Math.sin(k1 * 1.4) * 3;
          var beatPhase = (e % BEAT) / BEAT;                 // синхронизировано с BPM самого уровня — сердце бьётся в такт его же мелодии
          var pulse = Math.pow(Math.max(0, Math.sin(beatPhase * Math.PI)), 4);
          scale = s * (1 + pulse * 0.07);
        }
        else if (goodMotion === 'echo'){                    // "Дежавю": узнавание, а не полёт или рост — ровно два чётких кивка (фраза уровня тоже звучит дважды), дальше герой замирает, а позади него всё это время держатся два полупрозрачных эха той же позы (см. частицы)
          if (k1 < 1.4){
            var nodPhase = (k1 % 0.7) / 0.7;
            dy = -Math.abs(Math.sin(nodPhase * Math.PI)) * 6;
          }
        }
        else { dy = -Math.abs(Math.sin(k1*6)) * 7; }         // "bounce" — прежний прыжок радости по умолчанию
      }
    } else {
      if (e < 1.2){ mood = 'wake'; dx = Math.sin(e * 40) * 2; }
      else {
        mood = 'angry';
        var k2 = e - 1.2;
        if (badMotion === 'fade'){ dy = Math.min(9, k2*4); scale = Math.max(0.4, s - k2*0.14); }
        else if (badMotion === 'alarm'){ dx = Math.sin(k2 * 30) * 2.5; }  // резче и чаще обычной тревожной дрожи
        else if (badMotion === 'eclipse'){                  // финал: не тихое угасание — короткая вспышка последней борьбы (триумф),
          if (k2 < 0.4) scale = s * (1 + Math.sin(k2/0.4 * Math.PI) * 0.18); // а затем тьма всё равно смыкается и поглощает целиком (мрак побеждает)
          else { var ke1 = Math.min(1, (k2-0.4)/0.9); dy = ke1*4; scale = Math.max(0, s * (1-ke1)); }
        }
        else if (badMotion === 'terror'){                   // буквально страх: не злость, а испуг — частая мелкая дрожь и лёгкое сжатие, будто вжимается в себя
          mood = 'scared';
          dx = Math.sin(k2 * 45) * 3.2 + Math.sin(k2 * 7) * 2;
          dy = -Math.abs(Math.sin(k2 * 6)) * 2;
          scale = s * (1 - Math.min(0.15, k2 * 0.05));
        }
        else if (badMotion === 'anxious'){                  // тревога: не вспышка гнева — неровная, нервная дрожь с паузами и лёгким съёживанием, будто ждёт удара
          mood = 'anxious';
          var restless = Math.floor(k2 * 5) % 3 === 0;      // тревога приходит волнами, а не ровным потоком
          dx = restless ? Math.sin(k2 * 55) * 2.2 : Math.sin(k2 * 10) * 0.5;
          dy = Math.min(3, k2 * 2);                          // едва заметно поджимается, сутулится
        }
        else if (badMotion === 'heartbreak'){                // разбитое сердце: без дрожи и рывков — тяжёлое, медленное оседание, никакой суеты
          mood = 'sad';
          dy = Math.min(7, k2 * 2.2);
          dx = Math.sin(k2 * 1.5) * 0.8;                      // едва заметное покачивание, не тряска
          scale = Math.max(0.6, s - k2 * 0.05);
        }
        else if (badMotion === 'plummet'){                   // "Падение": не тихо оседать на месте — герой должен буквально проваливаться и пропадать из кадра
          mood = 'scared';
          dy = Math.min(170, k2 * k2 * 42);                    // ускоряющийся провал вниз, а не плавное оседание
          dx = Math.sin(k2 * 11) * Math.max(0, 3 - k2 * 2.2);  // кувырок в первый миг, затем тело выравнивается носом вниз
          scale = Math.max(0.3, s - k2 * 0.08);                // чуть уменьшается, будто удаляется вниз
        }
        else if (badMotion === 'glitch'){                    // "Дежавю" сбилась: не дрожь от досады — запись буквально заедает, позиция скачет дискретными рывками, а не плавно
          mood = 'confused';
          var stepT = Math.floor(k2 * 8) / 8;                  // дискретные "кадры" вместо непрерывного движения
          dx = Math.sin(stepT * 47) * 5;
          dy = Math.sin(stepT * 31) * 3;
          scale = s * (1 + (Math.sin(stepT * 13) > 0.5 ? 0.08 : -0.05));
        }
        else { dx = Math.sin(k2 * 18) * 1.5; }                            // "shake" — прежняя дрожь досады по умолчанию
      }
    }
    drawHero(cx + dx, cy + dy, scale, mood);

    // искорки и вспышки тоже уменьшены под мелкую фигурку и жмутся к ней,
    // иначе на пустом поле они выглядели бы отдельными объектами
    if (cutGood && e > 1.4){
      // цвет — акцент уровня (обычно кремовый, у "Сна о любимой" тёплый
      // розовый), чтобы у каждого сна была своя радость, а не одна на всех
      var glow = lv.endingColor || COL.cream;
      if (goodMotion === 'float'){
        // частицы медленно всплывают мимо героя вверх, а не кружат по орбите
        for (var kf = 0; kf < 5; kf++){
          var fp = ((e - 1.4) * 13 + kf * 9) % 34;
          px(cx + dx + (kf - 2) * 8, cy + dy + 16 - fp, 2, 2, kf % 2 ? COL.lav : glow);
        }
      } else if (goodMotion === 'charged'){
        // тесное частое мерцание вплотную к герою — заряд, а не орбита полёта
        for (var kc = 0; kc < 4; kc++){
          var ac = kc*1.57 + e*6, rc = 9 + Math.sin(e*8+kc)*2;
          px(cx + dx + Math.cos(ac)*rc, cy + dy + Math.sin(ac)*rc*0.6, 2, 2, kc % 2 ? COL.lav : glow);
        }
      } else if (goodMotion === 'exhale'){
        // частицы дыхания медленно расходятся в стороны и тают
        var bp = Math.min(1, (e - 1.4) / 1.3);
