        px(cx + dx - 14*bp, cy + dy - 4 - bp*6, 2, 2, glow);
        px(cx + dx + 14*bp, cy + dy - 4 - bp*6, 2, 2, glow);
      } else if (goodMotion === 'land'){
        // лёгкая пыль у ног ровно в момент касания земли, недолго
        if (e - 1.4 < 0.35){
          px(cx - 8, cy + dy + 11, 2, 2, COL.lav);
          px(cx + 7, cy + dy + 11, 2, 2, COL.lav);
        }
      } else if (goodMotion === 'ascend'){
        // частицы следуют за теми же четырьмя фазами, что и само движение
        // героя (см. ветку выше): спираль на взлёте и подъёме, один широкий
        // разлетающийся импульс плюс вспышка на весь экран в кульминации, и
        // медленно гаснущие угольки в послесвечении
        if (k1 < 3.6){
          for (var ka = 0; ka < 8; ka++){
            var aa = ka*0.785 + e*3, ra = 14 + (ka%2)*8 + Math.sin(e*4+ka)*2;
            px(cx + dx + Math.cos(aa)*ra, cy + dy + Math.sin(aa)*ra*0.6, 2, 2, ka % 2 ? COL.lav : glow);
          }
        } else if (k1 < 4.6){
          var kBurst = Math.min(1, (k1 - 3.6) / 1.0);
          var rBurst = 6 + kBurst * 46;
          for (var kbu = 0; kbu < 10; kbu++){
            var abu = kbu * 0.628;
            px(cx + dx + Math.cos(abu)*rBurst, cy + dy + Math.sin(abu)*rBurst*0.6, 2, 2, kbu % 2 ? COL.lav : glow);
          }
          ctx.globalAlpha = Math.max(0, 0.35 - kBurst*0.35);
          px(0, 0, W, H, glow);
          ctx.globalAlpha = 1;
        } else {
          var kAfter = Math.min(1, (k1 - 4.6) / 2.2);
          for (var kaf = 0; kaf < 5; kaf++){
            var aaf = kaf*1.256 + e*1.2, raf = 10 + Math.sin(e*2+kaf)*3;
            ctx.globalAlpha = Math.max(0, 1 - kAfter);
            px(cx + dx + Math.cos(aaf)*raf, cy + dy + Math.sin(aaf)*raf*0.6, 2, 2, kaf % 2 ? COL.lav : glow);
            ctx.globalAlpha = 1;
          }
        }
      } else if (goodMotion === 'defiant'){
        // тьма, что подступала в самой игре, один раз резко отброшена кольцом света — не праздник, а именно отпор
        var kb = Math.min(1, k1 / 0.8);
        var rb = 10 + kb * 18;
        for (var kdb = 0; kdb < 4; kdb++){
          var adb = kdb * 1.57;
          px(cx + dx + Math.cos(adb)*rb, cy + dy + Math.sin(adb)*rb*0.6, 2, 2, kdb % 2 ? COL.lav : glow);
        }
      } else if (goodMotion === 'heartbeat'){
        // целое сердце (та же форма, что и падающие ноты этого уровня) над
        // головой — не улетает и не кружит, а просто бьётся в такт мелодии:
        // раздувается на каждом ударе и посылает мягкое кольцо света
        var beatPhase2 = (e % BEAT) / BEAT;
        var pulse2 = Math.pow(Math.max(0, Math.sin(beatPhase2 * Math.PI)), 4);
        var hx = cx + dx, hy = cy + dy - 22;
        drawHeart(hx, hy, 7 + pulse2 * 2.5, glow);
        if (beatPhase2 < 0.16){
          var ringK = beatPhase2 / 0.16;
          var ringR = 9 + ringK * 15;
          ctx.globalAlpha = Math.max(0, 0.5 - ringK * 0.5);
          drawRing(hx, hy, ringR, ringR - 2, glow);
          ctx.globalAlpha = 1;
        }
      } else if (goodMotion === 'echo'){
        // само дежавю: два полупрозрачных повтора той же позы, каждый чуть
        // сдвинут по фазе покачивания — видишь себя же, но будто на миг раньше
        ctx.globalAlpha = 0.30;
        drawHero(cx + dx, cy + dy - 9 + Math.sin(e*2.2) * 3, scale, mood);
        ctx.globalAlpha = 0.15;
        drawHero(cx + dx, cy + dy - 16 + Math.sin(e*2.2 - 0.6) * 3, scale, mood);
        ctx.globalAlpha = 1;
      } else {
        // орбита привязана к самому герою (cy + dy), а не к центру экрана:
        // иначе в прыжке он поднимается выше орбиты и искорки лезут на тело
        for (var k = 0; k < 6; k++){
          var a = k * 1.047 + e * 2, r = 21 + Math.sin(e*5 + k) * 3;
          px(cx + dx + Math.cos(a)*r, cy + dy + Math.sin(a)*r*0.6, 2, 2, k % 2 ? COL.lav : glow);
        }
      }
    }
    if (!cutGood && e > 1.2){
      if (badMotion === 'fade'){
        // пара тусклых частиц медленно оседает вниз, будто гаснет вместе с героем
        if (Math.floor(e*4) % 2 === 0){
          px(cx - 13, cy + dy + 14, 2, 2, COL.violet);
          px(cx + 11, cy + dy + 16, 2, 2, COL.violet);
        }
      } else if (badMotion === 'alarm'){
        // маленький мигающий будильник рядом с героем — не текст, просто значок
        if (Math.floor(e*8) % 2 === 0){
          drawDisc(cx + dx + 16, cy - 14, 4, COL.blood);
          px(cx + dx + 13, cy - 19, 2, 3, COL.blood);
          px(cx + dx + 18, cy - 19, 2, 3, COL.blood);
        }
      } else if (badMotion === 'eclipse'){
        var glowB = lv.endingColor || COL.cream;
        // короткая вспышка света ровно на переломе фазы борьбы — герой ещё сопротивляется
        if (Math.abs(e - 1.2 - 0.4) < 0.12){
          for (var kf2 = 0; kf2 < 6; kf2++){
            var af2 = kf2 * 1.047;
            px(cx + dx + Math.cos(af2)*16, cy + dy + Math.sin(af2)*10, 2, 2, glowB);
          }
        }
        // а следом смыкающееся кольцо тьмы, которое всё же поглощает героя целиком
        var kk2 = Math.max(0, (e - 1.2 - 0.4) / 0.9);
        for (var ke2 = 0; ke2 < 6; ke2++){
          var ae2 = ke2 * 1.047 + e * 2, re2 = Math.max(0, 22 - kk2 * 24);
          px(cx + dx + Math.cos(ae2)*re2, cy + dy + Math.sin(ae2)*re2*0.6, 2, 2, COL.blood);
        }
      } else if (badMotion === 'terror'){
        // тёмные силуэты буквально подступают со всех сторон — то, чего сон боится
        var kk3 = Math.min(1, (e - 1.2) / 1.6);
        var re3 = 30 - kk3 * 14;
        px(cx + dx - re3,       cy + dy - 6, 2, 3, COL.blood);
        px(cx + dx + re3,       cy + dy - 6, 2, 3, COL.blood);
        px(cx + dx - re3*0.7,   cy + dy + 10, 2, 3, COL.blood);
        px(cx + dx + re3*0.7,   cy + dy + 10, 2, 3, COL.blood);
      } else if (badMotion === 'anxious'){
        // никакой тьмы вокруг и никаких силуэтов — тревога не снаружи, а внутри:
        // одна капля пота то появляется, то пропадает, неровно, невпопад
        if (Math.floor(e * 5) % 3 === 0){
          px(cx + dx + 13, cy + dy - 17, 2, 4, COL.lav);
        }
      } else if (badMotion === 'heartbreak'){
        // сердечко над головой (тема уровня) раскалывается на две половины
        // и медленно, тяжело расходится в стороны и вниз, тускнея
        var hb = Math.min(1, k2 / 1.8);
        var hcx = cx + dx, hcy = cy + dy - 22;
        ctx.globalAlpha = Math.max(0.15, 1 - hb * 0.75);
        drawHeartHalf(hcx - hb*9, hcy + hb*10, 7, lv.endingColor || COL.rose, -1);
        drawHeartHalf(hcx + hb*9, hcy + hb*10, 7, lv.endingColor || COL.rose, 1);
        ctx.globalAlpha = 1;
        // редкие тяжёлые слёзы — без суеты и мигания, просто капают одна за другой
        if (Math.floor(e * 2.2) % 2 === 0){
          px(cx + dx - 6, cy + dy + 13, 2, 3, COL.lav);
        }
      } else if (badMotion === 'plummet'){
        // штрихи скорости тянутся вверх от героя и удлиняются вместе с разгоном падения
        var streak = Math.min(26, k2 * k2 * 11);
        px(cx + dx - 5, cy + dy - 14 - streak,       2, streak,       COL.lav);
        px(cx + dx + 4, cy + dy - 10 - streak * 0.7, 2, streak * 0.7, COL.lav);
      } else if (badMotion === 'glitch'){
        // никакого плавного эха, как в хорошей концовке — обрывок повтора
        // мигает резко и невпопад, то тут, то там, будто запись повреждена
        if (Math.floor(e * 9) % 2 === 0){
          var stepT3 = Math.floor(e * 9) / 9;
          ctx.globalAlpha = 0.32;
          drawHero(cx + dx + Math.sin(stepT3 * 53) * 11, cy + dy + Math.sin(stepT3 * 29) * 7, scale, mood);
          ctx.globalAlpha = 1;
        }
      } else if (Math.floor(e*6) % 2 === 0){
        px(cx - 24, cy - 11, 2, 2, COL.blood);
        px(cx + 22, cy - 11, 2, 2, COL.blood);
      }
    }
  }
  /*
    Герой участвует в игре, а не просто покачивается рядом: на каждое
    попадание он подпрыгивает и наклоняется в сторону той дорожки, по
    которой только что сыграла нота, — то есть буквально прыгает туда,
    куда пришёлся удар. На промах — вздрагивает и на мгновение сердится.
    Без реакции — обычное сонное покачивание, как раньше.
  */
  function drawSleeper(t){
    var mood = 'sleep', dx = 0, dy = Math.sin(t*2) * 1.8;

    var latest = null;
    for (var i = flashes.length - 1; i >= 0; i--){
      if (flashes[i].kind === 'hit' || flashes[i].kind === 'miss'){ latest = flashes[i]; break; }
    }
    if (latest){
      var age = t - latest.t, win = 0.22;
      if (age < win){
        var k = 1 - age / win;
        if (latest.kind === 'hit'){
          mood = 'happy';
          dx = (LANE_X[latest.lane] - W/2) * 0.16 * k;   // наклон к дорожке ноты
          dy = -10 * k + Math.sin(t*2) * 1.8 * (1 - k);   // прыжок вверх, затем обратно к покачиванию
        } else {
          mood = 'angry';
          dx = Math.sin(age * 60) * 4 * k;                // короткая дрожь от досады
        }
      }
    }

    drawHero(W/2 + dx, HERO_BASE_Y + dy, 1, mood);

    particles.forEach(function(p){
      ctx.globalAlpha = Math.max(0, p.life);
      drawPixelText('z', p.x, p.y, FONT_NATIVE, COL.lav); // декор, читать не нужно
      ctx.globalAlpha = 1;
    });
  }

  var ARROW_DIR = ['left','up','down','right']; // порядок — как у LANES/LANE_X: влево, вверх, вниз, вправо
  function drawLanes(t){
    LANE_X.forEach(function(x, i){
      px(x - LANE_W/2, 0, LANE_W, H, COL.laneOff);
      if (IS_MOBILE && i > 0) px(x - LANE_W/2, 0, 1, H, 'rgba(241,225,249,0.12)'); // граница между дорожками во всю ширину
    });

    if (IS_MOBILE){
      /*
        Мобильный режим: дорожки на всю ширину экрана, плитки падают через
        весь экран, как в Magic Tiles. Кольцо-мишень заменено на широкий
        хит-бар — горизонтальную полосу на всю ширину дорожки, которая
        вспыхивает при попадании. Никакой иконки клавиши под баром не
        рисуем: играют тапом, стрелки и WASD тут вообще не задействованы.
      */
      var barH = 8;
      LANE_X.forEach(function(x, i){
        var flashed = flashes.some(function(f){ return f.lane === i; });
        px(x - LANE_W/2 + 3, HIT_Y - barH/2, LANE_W - 6, barH, flashed ? COL.cream : COL.lav);
      });
    } else {
      // линия удара
      px(LANE_X[0]-24, HIT_Y-1, LANE_X[3]-LANE_X[0]+48, 3, COL.lav);

      // кольца-мишени и вспышки — жёсткий круг по расстоянию, пиксельные стрелки, без fillText/arc
      LANE_X.forEach(function(x, i){
        var flashed = flashes.some(function(f){ return f.lane === i; });
        drawRing(x, HIT_Y, 12, 10, flashed ? COL.cream : COL.lav);
        // в круге мишени показываем ту клавишу, которая реально работает
        // сейчас: стрелку или букву WASD — в зависимости от выбранной схемы
        if (controlScheme === 'wasd') drawLetterIcon(WASD_LETTERS[i], x, HIT_Y, COL.cream);
        else drawArrowIcon(ARROW_DIR[i], x, HIT_Y, COL.cream);
      });
    }

    flashes.forEach(function(f){
      var age = t - f.t;
      var a = Math.max(0, 1 - age/0.25);
      ctx.globalAlpha = a;
      var color = f.kind === 'miss' ? COL.blood : (f.kind === 'whiff' ? COL.violet : COL.cream);
      if (IS_MOBILE) px(LANE_X[f.lane] - LANE_W/2 + 4, HIT_Y - 26, LANE_W - 8, 52, color);
      else px(LANE_X[f.lane]-24, HIT_Y-24, 48, 48, color);
      ctx.globalAlpha = 1;
    });
  }

  function drawNotes(t){
    chart.forEach(function(n){
      if (n.type === 'hidden') return;   // Дежавю (второй проход фразы) — без видимого шарика
      if (n.judged && n.result !== null && t > n.t + 0.1) return;
      var progress = (t - (n.t - n.travel)) / n.travel;
      if (progress < -0.02 || progress > 1.15) return;
      var y = SPAWN_Y + progress * (HIT_Y - SPAWN_Y);

      // "Тревожный сон": нота видна всё время, дрожит и перепрыгивает на
      // другую дорожку РОВНО ОДИН РАЗ, и не под конец — переход всегда
      // происходит на 40% пути, так что в истинной (судящей) дорожке нота
      // проводит оставшиеся 60% полёта — времени среагировать хватает
      var lanesToDraw = n.lanes, jitter = 0;
      if (n.type === 'restless'){
        jitter = Math.sin(t*37 + n.t*13) * 2.5;
        if (n.jumps && n.jumps.length === 2){
          lanesToDraw = [progress < RESTLESS_SWITCH ? n.jumps[0] : n.jumps[1]];
        }
      }
      var innerColor = n.type === 'avoid' ? COL.blood : (n.type === 'restless' ? COL.lav : COL.cream);
      lanesToDraw.forEach(function(lane){
        var x = LANE_X[lane] + jitter;
        if (curLevelDef(levelIdx).noteShape === 'heart'){
          drawHeart(x, y, IS_MOBILE ? 16 : 8, COL.violet);
          drawHeart(x, y, IS_MOBILE ? 10 : 5, innerColor);
        } else if (IS_MOBILE){
          // почти во всю ширину дорожки, с полями по бокам, чтобы была видна
          // граница соседней дорожки (TILE_W = LANE_W - 10)
          px(x - TILE_W/2, y - TILE_H/2, TILE_W, TILE_H, COL.violet);
          px(x - TILE_W/2 + TILE_BORDER, y - TILE_H/2 + TILE_BORDER, TILE_W - TILE_BORDER*2, TILE_H - TILE_BORDER*2, innerColor);
        } else {
          px(x-8, y-8, 16, 16, COL.violet);
          px(x-5, y-5, 10, 10, innerColor);
        }
      });
    });
  }

  /*
    "Дежавю": маленький пульсирующий индикатор сверху по центру, вспыхивает
    ровно на каждый такт — та же величина (beatEnergy), что уже двигает
    фон, просто здесь она даёт постоянную видимую точку опоры для ритма,
    отдельную от падающих нот (часть из них скрыта во время повтора).
  */
  function drawMetronome(t){
    var e = beatEnergy(t);
    var r = 3 + e * 3;
    drawDisc(W/2, IS_MOBILE ? 34 : 10, r, e > 0.5 ? COL.cream : COL.lav);
  }

  function drawHUD(t){
    if (IS_MOBILE){
      /*
        Дорожки теперь во всю ширину экрана — боковых полей для очков/комбо,
        как в landscape-версии, больше нет. Левый верхний угол занят кнопкой
        паузы, поэтому HUD сжат в тонкую полосу справа: шкала сна сверху на
        всю ширину, очки и комбо одной строкой мелкого кегля справа от неё —
        всё умещается над SPAWN_Y, ничего не перекрывая.
      */
      var barW = W - 12, barX = 6;
      px(barX, 2, barW, 3, 'rgba(241,225,249,0.15)');
      px(barX, 2, barW * Math.max(0,health)/100, 3, health > 30 ? COL.lav : COL.blood);

      var hudImg = pixelTextCanvas(score + ' · x' + combo, FONT_NATIVE, COL.cream);
      ctx.drawImage(hudImg, W - 6 - hudImg.width, 12);
      return;
    }
    // дорожки занимают x=81..220, поэтому HUD живёт в свободном левом поле,
    // а шкала сна — в правом: так крупный текст ни с чем не пересекается
    drawPixelText('очки', 10, 8, TEXT, COL.lav);
    drawPixelText(String(score), 10, 40, TEXT, COL.cream);
    drawPixelText('комбо', 10, 86, TEXT, COL.lav);
    drawPixelText(String(combo), 10, 118, TEXT, COL.cream);

    // шкала сна (здоровье)
    var barW = 99, barX = W - 12 - barW;
    px(barX, 12, barW, 9, 'rgba(241,225,249,0.15)');
    px(barX, 12, barW * Math.max(0,health)/100, 9, health > 30 ? COL.lav : COL.blood);
  }

  // надписи за серию всплывают над дорожками игаснут за полторы секунды
  function drawBonusPops(t){
    bonusPops.forEach(function(b){
      var age = t - b.t;
      ctx.globalAlpha = Math.max(0, 1 - age / 1.4);
      drawPixelTextCentered(b.text, W/2, (IS_MOBILE ? 120 : 72) - age * 14, IS_MOBILE ? FONT_NATIVE : TEXT, COL.cream);
      ctx.globalAlpha = 1;
    });
  }

  /*
    Сетка уровней для меню. Раскладка считается каждый раз заново по числу
    уровней (не более 4 в ряд), поэтому если уровней станет больше трёх —
    сетка сама перейдёт на несколько рядов, а всё, что рисуется ниже неё,
    сама пересчитает свою позицию от фактического низа сетки.
  */
  var TILE = 56, TILE_GAP = 12;   // уменьшены под два ряда (8 снов), чтобы под сеткой осталось место для текста
  function gridLayout(){
    // TOTAL_TILES = LEVELS.length + 1 — восемь снов плюс девятая плитка
    // бесконечного сна; при 4 в ряд девятая уходит в третий ряд
    var cols = Math.min(TOTAL_TILES, 4);
    var rows = Math.ceil(TOTAL_TILES / cols);
    var gridW = cols * TILE + (cols - 1) * TILE_GAP;
    var gridH = rows * TILE + (rows - 1) * TILE_GAP;
    var startX = Math.round((W - gridW) / 2);
    var startY = IS_MOBILE ? 100 : 80; // на мобильном ниже заголовка и луны на фоне
    return { cols: cols, rows: rows, startX: startX, startY: startY, bottom: startY + gridH };
  }
  function drawLevelGrid(t){
    var g = gridLayout();
    for (var i = 0; i < TOTAL_TILES; i++){
      var col = i % g.cols, row = Math.floor(i / g.cols);
      var x = g.startX + col * (TILE + TILE_GAP);
      var y = g.startY + row * (TILE + TILE_GAP);
      var selected = i === levelIdx;
      var locked = !isUnlocked(i);
      var bob = selected ? Math.sin(t * 4) * 2 : 0;   // выбранная плитка чуть живее остальных

      ctx.globalAlpha = locked ? 0.05 : (selected ? 0.30 : 0.14);
      px(x, y + bob, TILE, TILE, COL.violet);
      ctx.globalAlpha = 1;

      var bw = selected ? 2 : 1, bc = locked ? 'rgba(172,169,230,0.25)' : (selected ? COL.cream : COL.lav);
      px(x, y + bob, TILE, bw, bc);
      px(x, y + bob + TILE - bw, TILE, bw, bc);
      px(x, y + bob, bw, TILE, bc);
      px(x + TILE - bw, y + bob, bw, TILE, bc);

      ctx.globalAlpha = locked ? 0.35 : 1;
      var tileLabel = i === ENDLESS_IDX ? '∞' : String(i + 1);
      drawPixelTextCentered(tileLabel, x + TILE/2, y + bob + TILE/2 - 13, TEXT, COL.cream);
      ctx.globalAlpha = 1;

      if (levelBest(i) > 0){                       // пройденный уровень — метка в углу
        px(x + TILE - 9, y + bob + 5, 4, 4, COL.lav);
      }
    }
    return g.bottom;
  }

  function centerText(lines, y0, size, color, maxWidth){
    var fontPx = size || FONT_NATIVE;
    var lead = fontPx + 3;
    var out = lines;
    if (maxWidth){
      out = [];
      lines.forEach(function(line){
        if (!line) { out.push(line); return; }
        out = out.concat(wrapPixelText(line, fontPx, maxWidth));
      });
    }
    out.forEach(function(line, i){
      if (line) drawPixelTextCentered(line, W/2, y0 + i*lead, fontPx, color || COL.cream);
    });
    return out.length; // сколько строк реально нарисовано — нужно, чтобы сдвинуть следующий текст, если было перенесено
  }

  /*
    Экран общего итога — показывается один раз, сразу после хорошей
    катсцены последнего сна, вместо привычного "В МЕНЮ". Не таймер на
    3.6/8.2 сек, как обычные катсцены, а спокойный зацикленный кадр без
    ограничения по времени: герой стоит уже по-настоящему проснувшимся, а
    вокруг него медленно кружат восемь огоньков — по одному на каждый
    пройденный сон, каждый своим акцентным цветом (тем же, что и в
    катсцене этого сна), — единственное место в игре, где видно все сны
    сразу как одно целое.
  */
  function drawFinale(t){
    var cx = W/2, cy = H/2 + 26, s = 1.1;
    var bob = Math.sin(t*1.6) * 3;
    for (var i = 0; i < LEVELS.length; i++){
      var a = (i / LEVELS.length) * Math.PI*2 + t*0.35;
      var r = 44 + Math.sin(t*1.2 + i)*4;
      var mx = cx + Math.cos(a)*r, my = cy + bob - 6 + Math.sin(a)*r*0.5;
      px(mx, my, 2, 2, LEVELS[i].endingColor || COL.cream);
    }
    drawHero(cx, cy + bob, s, 'happy');
    centerText(['ВСЕ СНЫ ПРОЙДЕНЫ'], 30, TITLE, COL.cream, W - 32);
    centerText([save.name + '  ·  ' + allLevelsBestTotal() + ' очков суммарно  ·  ' + clearedCount() + '/' + LEVELS.length],
               72, FONT_NATIVE, COL.lav, W - 32);
    if (Math.floor(t*2) % 2 === 0) centerText([IS_MOBILE ? 'тап — в меню' : 'ENTER — в меню'], H - 26, TEXT, COL.cream);
  }

  function render(){
    var t = state === STATE.PLAY ? now() : performance.now()/1000;
    if (state === STATE.CUT){ drawCutscene(performance.now()/1000); return; }
    // на паузе сцена позади меню рисуется тем же кадром, что и в момент
    // ухода на паузу (gt = pausedGameT), а не текущим t — иначе ноты и
    // герой продолжали бы жить под затемнением, хотя игра остановлена
    var gt = state === STATE.PAUSE ? pausedGameT : t;
    drawBackground(gt);
    // дорожки, кольца, ноты и герой — во время игры и на паузе (позади
    // затемнения): на остальных экранах они съедали место под текст и
    // перекрывали его (герой особенно)
    var showPlayScene = state === STATE.PLAY || state === STATE.PAUSE;
    if (showPlayScene) drawEqualizer(gt);
    if (showPlayScene) drawLanes(gt);
    if (showPlayScene) drawNotes(gt);
    if (showPlayScene) drawSleeper(gt);
    if (showPlayScene) drawHUD(gt);
    if (showPlayScene) drawBonusPops(gt);
    if (showPlayScene && curLevelDef(levelIdx).metronome) drawMetronome(gt);
    // кнопка паузы видна только пока реально играем — на самой паузе там
    // уже открыто меню, тапать по углу незачем
    if (state === STATE.PLAY) drawPauseButton();

    // объединённая версия: часть подсказок и статистики — переменной длины
    // (имя игрока, очки, названия снов) и мерялась на глаз под landscape
    // холст 450px шириной. На портретном мобильном холсте (288px) она уже не
    // помещается и вылезает за край экрана, поэтому такие строки идут через
    // centerText(..., maxWidth) — на десктопе, где и так есть запас, перенос
    // ни на что не влияет, там мы просто добавляем не срабатывающую страховку
    var TXW = W - 32;

    if (state === STATE.PAUSE){
      ctx.globalAlpha = 0.72;
      px(0, 0, W, H, COL.ink);
      ctx.globalAlpha = 1;
      centerText(['ПАУЗА'], IS_MOBILE ? 170 : 100, TITLE, COL.cream);
      var pBlink = Math.floor(t*2) % 2 === 0;
      centerText(['ПРОДОЛЖИТЬ'], IS_MOBILE ? 272 : 160, TEXT, pauseChoice === 0 ? (pBlink ? COL.cream : COL.lav) : COL.lav);
      centerText(['ЗАНОВО'],      IS_MOBILE ? 326 : 192, TEXT, pauseChoice === 1 ? (pBlink ? COL.cream : COL.lav) : COL.lav);
      centerText(['В МЕНЮ'],      IS_MOBILE ? 380 : 224, TEXT, pauseChoice === 2 ? (pBlink ? COL.cream : COL.lav) : COL.lav);
      return;
    }

    if (state === STATE.NAME){
      centerText(['КАК ТЕБЯ ЗВАТЬ?'], IS_MOBILE ? 95 : 56, TEXT, COL.cream);
      var blinkOn = Math.floor(t*3) % 2 === 0;
      var nameImg = pixelTextCanvas(nameText.length ? nameText : ' ', TEXT, COL.cream);
      var nameY = IS_MOBILE ? 205 : 120;
      var nameX = Math.round(W/2 - nameImg.width/2);
      ctx.drawImage(nameImg, nameX, nameY);
      if (blinkOn) px(nameX + nameImg.width + 4, nameY + 4, 3, TEXT - 8, COL.cream);   // курсор — мигающая палочка, не буква
      // на мобильной версии поля нет физической клавиатуры — печатают на
      // системной, которую открывает тап по невидимому #nameInput
      if (IS_MOBILE){
        centerText(['тап откроет клавиатуру'], 286, FONT_NATIVE, COL.lav, TXW);
        if (Math.floor(t*2) % 2 === 0) centerText(['Готово — на клавиатуре'], 340, TEXT, COL.cream, TXW);
      } else {
        centerText(['печатай, Backspace — стереть'], 168, FONT_NATIVE, COL.lav, TXW);
        if (Math.floor(t*2) % 2 === 0) centerText(['ENTER — готово'], 198, TEXT, COL.cream);
      }
    }

    if (state === STATE.HINT){
      var hlv = curLevelDef(levelIdx);
      var hintTitle = levelIdx === ENDLESS_IDX ? hlv.name : ((levelIdx + 1) + '. ' + hlv.name);
      centerText([hintTitle], IS_MOBILE ? 128 : 74, TITLE, COL.cream, TXW);
      centerText([hlv.hint || ''], IS_MOBILE ? 238 : 140, FONT_NATIVE, COL.lav, TXW);
      if (IS_MOBILE){
        if (Math.floor(t*2) % 2 === 0) centerText(['тап — начать'], 340, TEXT, COL.cream);
        centerText(['иконка в углу — пауза во время игры'], 394, FONT_NATIVE, COL.lav, TXW);
      } else {
        if (Math.floor(t*2) % 2 === 0) centerText(['ENTER — начать'], 200, TEXT, COL.cream);
        centerText(['Esc — пауза во время игры'], 232, FONT_NATIVE, COL.lav);
      }
    }

    if (state === STATE.MENU){
      centerText(['Д Р Ё М А'], IS_MOBILE ? 34 : 20, TITLE, COL.cream);
      var gridBottom = drawLevelGrid(t);
      var locked = !isUnlocked(levelIdx);
      var isEndlessSel = levelIdx === ENDLESS_IDX;
      var menuLv = curLevelDef(levelIdx);
      var nameLine = isEndlessSel ? menuLv.name : ((levelIdx + 1) + '. ' + menuLv.name);
      centerText([nameLine], gridBottom + (IS_MOBILE ? 10 : 8), TEXT, locked ? COL.lav : COL.cream, TXW);
      // бесконечный сон не проходится на очки — у него нет "цели", только
      // рекорд за лучший заход, поэтому вторая строка меню у него другая
      if (IS_MOBILE){
        // имя, рекорд, цель и общий счёт вместе не помещаются в одну строку
        // на 288px холсте — та же информация, что и на десктопе, но в два ряда
        centerText([save.name + '  ·  рекорд ' + levelBest(levelIdx)], gridBottom + 44, FONT_NATIVE, COL.lav, TXW);
        centerText([isEndlessSel ? 'играй, пока хватает сил' : ('цель ' + requiredScore() + '  ·  всего ' + save.total)], gridBottom + 60, FONT_NATIVE, COL.lav, TXW);
      } else {
        var statText = isEndlessSel
          ? (save.name + '  ·  рекорд ' + levelBest(levelIdx) + '  ·  играй, пока хватает сил')
          : (save.name + '  ·  рекорд ' + levelBest(levelIdx) + '  ·  цель ' + requiredScore() + '  ·  всего ' + save.total);
        centerText([statText], gridBottom + 42, FONT_NATIVE, COL.lav, TXW);
      }
      var menuActionY = gridBottom + (IS_MOBILE ? 82 : 60);
      if (locked){
        centerText(['пройди предыдущий сон'], menuActionY, TEXT, COL.lav, TXW);
      } else if (Math.floor(t*2) % 2 === 0){
        centerText([IS_MOBILE ? 'тап — начать' : 'ENTER — начать'], menuActionY, TEXT, COL.cream, TXW);
      }
      // настройки — это переключатель стрелки/WASD для иконки под хит-баром;
      // на мобильной версии этой иконки нет вовсе (играют тапом), поэтому и
      // пункт настроек там не показываем (см. handleKey/handleTap)
      if (!IS_MOBILE) centerText(['S — настройки'], gridBottom + 82, FONT_NATIVE, COL.lav);
    }

    if (state === STATE.SETTINGS){
      drawGear(W/2, IS_MOBILE ? 95 : 56, IS_MOBILE ? 12 : 10, COL.lav);
      centerText(['НАСТРОЙКИ'], IS_MOBILE ? 143 : 84, TITLE, COL.cream);
      centerText(['управление'], IS_MOBILE ? 224 : 132, FONT_NATIVE, COL.lav);
      var schemeLabel = controlScheme === 'wasd' ? 'WASD' : 'СТРЕЛКИ';
      centerText(['← ' + schemeLabel + ' →'], IS_MOBILE ? 265 : 156, TEXT, COL.cream, TXW);
      centerText([IS_MOBILE ? 'тап здесь — закрыть' : 'S — закрыть'], IS_MOBILE ? 357 : 210, TEXT, COL.lav, TXW);
    }

    if (state === STATE.OVER || state === STATE.CLEAR){
      var lv2 = curLevelDef(levelIdx);
      var good = state === STATE.CLEAR;
      var title = good ? lv2.endings.good : lv2.endings.bad;
      centerText([title], IS_MOBILE ? 65 : 38, TITLE, good ? COL.cream : COL.blood, TXW);

      var statLine = good
        ? 'очки: ' + score + '   точно: ' + (hits + avoidedCount) + '/' + totalActions
        : (scoreShortfall ? 'очки: ' + score + ' из ' + requiredScore() : 'очки: ' + score);
      // на мобильном экран уже, поэтому статистика идёт мелким (родным)
      // кеглем вместо TEXT — так она достоверно умещается в одну строку и
      // не наезжает на строку рекорда следом, даже с четырёхзначными очками
      var statSize = IS_MOBILE ? FONT_NATIVE : TEXT;
      centerText([statLine], IS_MOBILE ? 163 : 96, statSize, COL.cream, TXW);

      centerText([newLevelRecord ? 'новый рекорд!' : 'рекорд: ' + levelBest(levelIdx)], IS_MOBILE ? 214 : 126,
                 statSize, newLevelRecord ? COL.cream : COL.lav, TXW);

      var deltaLine = lastDelta === null ? 'первый раз на этом сне'
        : lastDelta > 0 ? '+' + lastDelta + ' к прошлому разу'
        : lastDelta < 0 ? lastDelta + ' к прошлому разу'
        : 'ровно как в прошлый раз';
      centerText([deltaLine], IS_MOBILE ? 258 : 152, FONT_NATIVE, COL.lav, TXW);

      var hasNext = good && levelIdx + 1 < LEVELS.length;
      var blink = Math.floor(t*2) % 2 === 0;
      var opt1Y = IS_MOBILE ? 340 : 200, opt2Y = IS_MOBILE ? 394 : 232;
      if (hasNext){
        centerText(['СЛЕДУЮЩИЙ СОН'], opt1Y, TEXT, resultChoice === 0 ? (blink ? COL.cream : COL.lav) : COL.lav);
        centerText(['В МЕНЮ'], opt2Y, TEXT, resultChoice === 1 ? (blink ? COL.cream : COL.lav) : COL.lav);
      } else if (good){
        // это последний сон — тап/Enter ведёт не в меню, а на экран общего итога
        if (blink) centerText(['ИТОГИ'], IS_MOBILE ? 367 : 216, TEXT, COL.cream);
      } else {
        centerText(['ЕЩЁ РАЗ'], opt1Y, TEXT, resultChoice === 0 ? (blink ? COL.cream : COL.lav) : COL.lav);
        centerText(['В МЕНЮ'], opt2Y, TEXT, resultChoice === 1 ? (blink ? COL.cream : COL.lav) : COL.lav);
      }
    }

    if (state === STATE.FINALE) drawFinale(t);
  }

  function loop(){
    update();
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
